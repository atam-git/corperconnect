  newCommunity(){if(!verified())return sheet({type:'gate',why:'Creating communities'});if(S.myComms.length>=3)return toast('You’ve reached the limit of 3 communities');go('createCommunity');},
  createCommunity(){S.errors={};const n=v('name');let ok=need('name','Use at least 3 characters.',x=>x.length>=3);
    if(ok&&/official|nysc\s*(hq|management|admin)/i.test(n)){S.errors.name='Only platform-created spaces can be called official.';ok=false;}
    if(ok&&Object.values(COMM).some(c=>c.name.toLowerCase()===n.toLowerCase())){S.errors.name='A community with this name already exists.';ok=false;}
    if(ok&&Object.values(COMM).some(c=>c.official&&n.toLowerCase().includes(c.name.toLowerCase()))){S.errors.name='This looks like an official space. Pick a different name.';ok=false;}
    ok=need('desc','Describe the purpose in at least 10 characters.',x=>x.length>=10)&&ok;
    if(!ok){render();return toast('Check the highlighted fields');}
    const d=S.draft,id=uid('c');
    COMM[id]={id,name:n,official:false,category:d.category,sub:S.me.state,members:1,today:0,joined:true,join:d.join==='Open'?'open':d.join==='Request'?'request':'invite',color:d.color,initials:initials(n),desc:v('desc'),rules:v('rules').split('\n').map(s=>s.trim()).filter(Boolean),mods:[],pinned:[],admin:'me',vis:d.vis};
    S.myComms.push(id);replace('communityDetail',{id});toast('Community created. You’re the admin.');},
  modApply(d){S.draft.mwhy='';S.draft.mexp='';sheet({type:'modApply',id:d.id});},
  submitModApply(d){S.errors={};if(!need('mwhy','Tell us a bit more (at least 20 characters).',x=>x.length>=20))return render();closeSheet();toast('Application sent to the platform team');},
  // create
  create(d){sheet({type:'create',comm:d.comm});},
  compose(d){const comm=S.sheet&&S.sheet.comm;if(['sell','accommodation','event'].includes(d.t)&&!verified())return sheet({type:'gate',why:{sell:'Selling items',accommodation:'Listing accommodation',event:'Creating events'}[d.t]});go('compose',{t:d.t,comm});},
  rmPhoto(d){S.draft.photos.splice(+d.i,1);render();},
  addOpt(){S.draft.optCount++;S.focus='f-opt'+(S.draft.optCount-1);render();},
  rmOpt(d){const i=+d.i,x=S.draft;for(let j=i;j<x.optCount-1;j++)x['opt'+j]=x['opt'+(j+1)];delete x['opt'+(x.optCount-1)];x.optCount--;render();},
  addFee(){S.draft.fees++;S.focus='f-fee'+(S.draft.fees-1)+'l';render();},
  rmFee(d){const i=+d.i,x=S.draft;for(let j=i;j<x.fees-1;j++){x['fee'+j+'l']=x['fee'+(j+1)+'l'];x['fee'+j+'a']=x['fee'+(j+1)+'a'];}delete x['fee'+(x.fees-1)+'l'];delete x['fee'+(x.fees-1)+'a'];x.fees--;render();},
  publish(d){const ty=d.t,x=S.draft;S.errors={};let ok=true;
    const opts=ty==='poll'?Array.from({length:x.optCount},(_,i)=>v('opt'+i)).filter(Boolean):[];
    if(ty==='photo'&&!x.photos.length){S.errors.photos='Add at least one photo.';ok=false;}
    if(ty==='discussion'){ok=need('title','Give your discussion a title.')&&ok;ok=need('text','Add some details.')&&ok;}
    if(ty==='question')ok=need('text','Write your question.',s=>s.length>=5)&&ok;
    if(ty==='poll'){ok=need('text','Write the poll question.')&&ok;if(opts.length<2){S.errors.opts='Add at least two options.';ok=false;}else if(new Set(opts.map(s=>s.toLowerCase())).size!==opts.length){S.errors.opts='Each option must be different.';ok=false;}}
    if(ty==='sell'||ty==='accommodation'){if(!x.photos.length){S.errors.photos='Add at least one photo.';ok=false;}
      ok=need('title','Add a title.')&&ok;ok=need('price','Enter a price in naira.',s=>Number(s)>0)&&ok;ok=need('text','Add a short description.')&&ok;ok=need('area','Add the area.')&&ok;
      if(!x.wa&&!x.call){S.errors.contact='Turn on at least one way to be contacted.';ok=false;}
      ok=need('phone','Enter a valid Nigerian mobile number.',s=>NGPHONE.test(s.replace(/\s/g,'')))&&ok;
      if(ty==='accommodation')ok=need('avail','When is it available?')&&ok;}
    if(ty==='event'){ok=need('title','Name your event.')&&ok;ok=need('text','Describe the event.')&&ok;ok=need('date','Pick a date.')&&ok;ok=need('time','Pick a time.')&&ok;ok=need('loc','Add a location.')&&ok;
      if(v('link')&&!/^https?:\/\/\S+\.\S+/.test(v('link'))){S.errors.link='Links should start with https://';ok=false;}}
    if(!ok){render();return toast('Check the highlighted fields');}
    if(['photo','discussion','question','poll'].includes(ty)){
      const id=uid('p'),comm=x.dest!=='feed'?x.dest:null,commOnly=comm&&!x.alsoFeed;
      POSTS[id]={id,type:ty,author:'me',community:comm,title:ty==='discussion'?v('title'):'',text:v('text'),media:[...x.photos],time:'Just now',likes:0,cc:0,reposts:0,batch:true,state:S.me.state,vis:commOnly?'Community':(x.vis==='Community'?'Public':x.vis),comments:[],
        poll:ty==='poll'?{options:opts.map(o=>[o,0]),voted:null,ends:'Ends in '+x.duration}:undefined};
      FEED.unshift({k:'post',id});S.myPosts.unshift(id);S.homeFilter='For You';backToTop();toast(comm?'Posted to '+COMM[comm].name:'Posted');return;}
    if(ty==='sell'||ty==='accommodation'){
      const id=uid('l');const fees=[];for(let i=0;i<x.fees;i++){const l=v('fee'+i+'l'),a=Number(x['fee'+i+'a']);if(l&&a>0)fees.push([l,a]);}
      LISTINGS[id]={id,kind:ty==='sell'?'item':'accommodation',title:v('title'),type:x.type,condition:x.condition,price:Number(x.price),unit:ty==='sell'?'':x.period,fees:ty==='sell'?[]:fees,area:v('area'),state:x.state,owner:'me',status:'Available',date:'just now',avail:v('avail'),likes:0,saved:false,liked:false,color:'#2B3B32',photos:[...x.photos],desc:v('text'),contact:{wa:x.wa,call:x.call}};
      FEED.unshift({k:'listing',id});S.myListings.unshift(id);replace('listing',{id});toast('Listing published');return;}
    if(ty==='event'){const id=uid('e'),f=fmtDate(x.date);
      EVENTS[id]={id,title:v('title'),...f,time:fmtTime(x.time),location:v('loc'),state:x.state,organiser:'me',orgName:x.organiser!=='me'?COMM[x.organiser].name:null,interested:0,going:1,rsvp:'going',status:'Upcoming',color:'#3A4A2B',photo:x.photos[0],link:v('link'),desc:v('text')};
      FEED.unshift({k:'event',id});S.myEvents.unshift(id);replace('event',{id});toast('Event published');}
  },
  // explore
  exTab(d){S.exploreTab=d.v;render();},
  setQ(d){S.q=d.v;render();},
  toggleAvail(){S.availOnly=!S.availOnly;render();},
  exPlace(d){S.q='';S.exploreState=d.v;S.exploreTab='Accommodation';if(topScreen().s==='explore')render();else go('explore');},
  // listings
  saveListing(d){const l=LISTINGS[d.id];l.saved=!l.saved;render();toast(l.saved?'Saved':'Removed from saved');},
  likeListing(d){const l=LISTINGS[d.id];l.liked=!l.liked;l.likes+=l.liked?1:-1;render();},
  nextPhoto(d){S.photoIdx=S.photoIdx||{};S.photoIdx[d.id]=((S.photoIdx[d.id]||0)+1)%(+d.n);render();},
  contact(d){S.reveal=null;sheet({type:'contact',m:d.m,id:d.id});},
  revealNum(d){S.reveal=d.id;render();},
  listingManage(d){sheet({type:'listingManage',id:d.id});},
  quickStatus(d){const l=LISTINGS[d.id];l.status=l.status==='Available'?(l.kind==='accommodation'?'Rented':'Sold'):'Available';render();toast('Marked '+l.status.toLowerCase());},
  setListingStatus(d){LISTINGS[d.id].status=d.v;closeSheet();toast('Marked '+d.v.toLowerCase());},
  renewListing(){closeSheet();toast('Renewed for another 30 days');},
  deleteListing(d){confirmSheet({title:'Delete this listing?',body:'It will disappear from Explore, feeds and saved lists.',cta:'Delete listing',act:'deleteListingYes',id:d.id,danger:true});},
  deleteListingYes(d){LISTINGS[d.id].deleted=true;S.sheet=null;back();toast('Listing deleted');},
  // events
  rsvp(d){const e=EVENTS[d.id],p=e.rsvp;if(p)e[p]--;if(p===d.v)e.rsvp=null;else{e.rsvp=d.v;e[d.v]++;}render();if(e.rsvp==='going')toast(S.settings.nEvents?'You’re going. We’ll remind you the day before.':'You’re going');},
  eventManage(d){const e=EVENTS[d.id];S.draft.edate='';S.draft.etime='';S.draft.eloc=e.location;sheet({type:'eventManage',id:d.id});},
  eventSave(d){const e=EVENTS[d.id];if(v('edate'))Object.assign(e,fmtDate(v('edate')));if(v('etime'))e.time=fmtTime(v('etime'));if(v('eloc'))e.location=v('eloc');closeSheet();toast(`Updated. ${e.interested+e.going} people notified.`);},
  eventStatus(d){EVENTS[d.id].status=d.v;render();toast('Marked '+d.v.toLowerCase());},
  eventCancelAsk(d){confirmSheet({title:'Cancel this event?',body:'Everyone who’s interested or going will be notified. This can’t be undone.',cta:'Cancel event',act:'eventCancel',id:d.id,danger:true});},
  eventCancel(d){EVENTS[d.id].status='Cancelled';closeSheet();toast('Event cancelled. Attendees notified.');},
  // profile
  profileTab(d){S.profileTab=d.v;render();},
  userTab(d){S.userTab[d.id]=d.v;render();},
  userMenu(d){sheet({type:'userMenu',id:d.id});},
  openFollow(d){S.followTab=d.v;go('followList',{id:d.id});},
  followTab(d){S.followTab=d.v;render();},
  milestoneAdd(){S.draft.mt='';S.draft.md='';sheet({type:'milestone'});},
  addMilestone(){S.errors={};if(!need('mt','Add a name for the milestone.'))return render();S.me.milestones.push({t:v('mt'),d:v('md')||'Nov 2026'});closeSheet();toast('Added to your journey');},
  saveProfile(){S.errors={};let ok=need('name','Enter your full name.',x=>x.length>=3);ok=need('username','3–20 lowercase letters, numbers, dots or underscores.',x=>UNAME.test(x))&&ok;
    if(ok&&v('username')!==S.me.username&&TAKEN.includes(v('username'))){S.errors.username='That username is taken.';ok=false;}
    if(!ok)return render();Object.assign(S.me,{name:v('name'),username:v('username'),bio:v('bio'),photo:S.draft.photo,interests:[...S.draft.interests],initials:initials(v('name'))});back();toast('Profile updated');},
  rmDraftPhoto(){S.draft.photo=null;render();},
  // notifications
  notifTab(d){S.notifTab=d.v;render();},
  readAll(){NOTIF.forEach(n=>n.read=true);render();toast('All caught up');},
  openNotif(d){const n=NOTIF.find(x=>x.id===d.id);n.read=true;const [s,id]=n.go;if(s==='user')return A.openUser({id});go(s,{id});},
  // settings
  toggleSet(d){S.settings[d.k]=!S.settings[d.k];render();if(d.k==='google')toast(S.settings.google?'Google connected':'Google disconnected');},
  setSetting(d){S.settings[d.k]=d.v;render();},
  blockTab(d){S.blockTab=d.v;render();},
  clearCache(){toast('Cache cleared');},
  saveContact(){S.errors={};let ok=need('email','Enter a valid email.',x=>EMAIL.test(x));if(v('phone')&&!NGPHONE.test(v('phone').replace(/\s/g,''))){S.errors.phone='Enter a valid Nigerian mobile number.';ok=false;}if(!ok)return render();S.me.email=v('email');S.me.phone=v('phone');toast('Contact details saved');},
  changePassword(){S.errors={};let ok=need('cur','Enter your current password.');ok=need('np','Use at least 8 characters.',x=>x.length>=8)&&ok;if(ok&&v('np2')!==v('np')){S.errors.np2='Passwords don’t match.';ok=false;}if(!ok)return render();S.draft.cur=S.draft.np=S.draft.np2='';render();toast('Password updated. Other devices were signed out.');},
  verifDemo(d){S.verif=d.v;setOfficial(d.v==='verified');
    if(d.v==='verified')NOTIF.unshift({id:uid('n'),cat:'service',text:'<b>You’re verified.</b> Official batch, camp and state communities are now open.',time:'now',read:false,go:['verification']});
    if(d.v==='rejected')NOTIF.unshift({id:uid('n'),cat:'service',text:'<b>Verification:</b> we couldn’t confirm your details. Tap to see why.',time:'now',read:false,go:['verification']});
    render();toast({verified:'Approved. Official communities unlocked.',rejected:'Rejected (prototype)',pending:'Back in review',unverified:'Reset to unverified'}[d.v]);},
  appeal(){toast('Appeal sent. A different reviewer will look at it.');},
  redeploySubmit(){S.errors={};if(!S.draft.docName){S.errors.doc='Upload your approval letter.';return render();}S.me.redeploy={state:S.draft.state,lga:v('lga'),reason:S.draft.reason};back();toast('Redeployment request sent for review');},
  redeployApprove(){const r=S.me.redeploy;S.me.history.push({from:S.me.state,to:r.state,when:'Nov 2026'});Object.assign(S.me,{state:r.state,lga:r.lga,redeploy:null});render();toast(`You’re now in ${r.state}. Your batch and camp history stay.`);},
  alumniAsk(){confirmSheet({title:'Mark service as completed?',body:'We’ll confirm your passing out. Your account, posts, followers and communities all stay. Your status changes to Alumni.',cta:'Submit for confirmation',act:'alumniRequest'});},
  alumniRequest(){S.me.alumniReq=true;S.sheet=null;render();toast('Sent for confirmation');},
  alumniApprove(){S.me.status='Completed';S.me.alumniReq=false;render();toast('Congratulations on passing out!');},
  downloadData(){toast('Request received. The real app emails you a download link.');},
  deactivateAsk(){confirmSheet({title:'Deactivate your account?',body:'Your profile and posts are hidden until you sign back in. Nothing is deleted.',cta:'Deactivate',act:'deactivate',danger:true});},
  deactivate(){S.sheet=null;S.stack=[{s:'welcome'}];render();toast('Deactivated. Sign in any time to come back.');},
  deleteAsk(){S.draft.confirmDel='';S.errors={};sheet({type:'deleteAccount'});},
  deleteAccount(){if(v('confirmDel')!=='DELETE'){S.errors.confirmDel='Type DELETE in capitals.';return render();}S.sheet=null;S.stack=[{s:'welcome'}];render();toast('Account scheduled for deletion');},
  logout(){S.stack=[{s:'welcome'}];S.sheet=null;render();toast('Logged out');}
};

const FILES={
  draftPhoto(f){if(f[0]){S.draft.photo=URL.createObjectURL(f[0]);render();}},
  verifyDoc(f){if(f[0]){S.draft.docName=f[0].name;delete S.errors.doc;render();}},
  redeployDoc(f){if(f[0]){S.draft.docName=f[0].name;delete S.errors.doc;render();}},
  reportEvidence(f){if(f[0]){S.draft.revName=f[0].name;render();}},
  composePhotos(f){const single=topScreen().t==='event';const arr=[...f].filter(x=>x.type.startsWith('image/')).slice(0,8).map(x=>URL.createObjectURL(x));if(single)S.draft.photos=arr.slice(0,1);else S.draft.photos.push(...arr);S.draft.photos=S.draft.photos.slice(0,8);delete S.errors.photos;render();}
};
const LIVE={
  exploreQ(val){S.q=val;const el=document.getElementById('exResults');if(el)el.innerHTML=exploreBody();},
  commQ(val){S.commQ=val;const el=document.getElementById('commResults');if(el)el.innerHTML=commResults();}
};
const CH={
  exState(val){S.exploreState=val;render();}, exPrice(val){S.explorePrice=val;render();},
  qFrom(val){S.settings.qFrom=val;}, qTo(val){S.settings.qTo=val;}
};

// ---------- Wiring ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||!app().contains(el))return;
  const a=el.dataset.a;if(a==='noop')return;
  if(el.disabled)return;
  const f=A[a];if(!f)return;
  e.preventDefault();e.stopPropagation();f(el.dataset,el);
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.k&&t.tagName!=='SELECT'){S.draft[t.dataset.k]=t.value;if(S.errors[t.dataset.k]){delete S.errors[t.dataset.k];t.classList.remove('bad');const er=document.getElementById('err-'+t.dataset.k);if(er)er.remove();}}
  if(t.dataset.live)LIVE[t.dataset.live](t.value);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.type==='file'&&t.dataset.file){FILES[t.dataset.file](t.files);t.value='';return;}
  if(t.dataset.c){CH[t.dataset.c](t.value);return;}
  if(t.tagName==='SELECT'&&t.dataset.k){S.draft[t.dataset.k]=t.value;if(t.dataset.rerender)render();}
});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();A[t.dataset.enter]({id:t.dataset.id});}
  if(e.key==='Escape'&&S.sheet){closeSheet();}
});
render();
</script></body></html>
