const app=()=>document.getElementById('app');
function topScreen(){return S.stack[S.stack.length-1];}
function keyOf(t){return S.stack.length+':'+t.s+':'+(t.id||'');}
function render(){
  const view=document.getElementById('view');
  const sc=view.querySelector('.scroll'); if(sc&&S.curKey) S.scrollMem[S.curKey]=sc.scrollTop;
  const t=topScreen();
  const fn=SC[t.s]||SC.home;
  view.innerHTML=fn(t);
  document.getElementById('sheet').innerHTML=S.sheet?`<div class="sheet-wrap" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-a="noop"><div class="grab"></div>${SH[S.sheet.type](S.sheet)}</div></div>`:'';
  const k=keyOf(t); const nsc=view.querySelector('.scroll'); if(nsc) nsc.scrollTop=S.scrollMem[k]||0; S.curKey=k;
  if(S.focus){const el=document.getElementById(S.focus); if(el){el.focus(); if(el.setSelectionRange&&el.type!=='email'&&el.type!=='number'){try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}} S.focus=null;}
}
function go(s,params={}){S.errors={}; S.sheet=null; if(INIT[s]) INIT[s](params); S.stack.push({s,...params}); render();}
function replace(s,params={}){S.errors={}; S.sheet=null; if(INIT[s]) INIT[s](params); S.stack[S.stack.length-1]={s,...params}; S.scrollMem[keyOf(topScreen())]=0; render();}
function back(){S.errors={}; S.sheet=null; if(S.stack.length>1){delete S.scrollMem[keyOf(topScreen())]; S.stack.pop();} render();}
function tabTo(t){S.errors={}; S.sheet=null; S.stack=[{s:t}]; render();}
function sheet(o){S.sheet=o; render();}
function closeSheet(){S.sheet=null; render();}
function toast(m){const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=m; app().appendChild(el); setTimeout(()=>el.remove(),2600);}

// ===== Home =====
function hiddenAuthor(id){return id&&id!=='me'&&(S.blocked.has(id)||S.muted.has(id));}
function refObj(r){return r.k==='post'?POSTS[r.id]:r.k==='listing'?LISTINGS[r.id]:EVENTS[r.id];}
function refAuthor(r){const o=refObj(r);return r.k==='post'?o.author:r.k==='listing'?o.owner:o.organiser;}
function refOk(r){const o=refObj(r);if(!o||o.deleted)return false;const a=refAuthor(r);if(hiddenAuthor(a))return false;
  if(r.k==='post'){if(o.community&&S.mutedComms.has(o.community)&&o.type!=='announcement')return false;if(o.type==='announcement'&&!COMM[o.community].joined)return false;}
  return true;}
function homeItems(){
  const f=S.homeFilter;let it=FEED.filter(refOk);
  if(f==='My Batch') it=it.filter(r=>{const o=refObj(r),a=refAuthor(r);return r.k==='post'?(o.batch||(a&&user(a).batch===S.me.batch)):(a&&user(a).batch===S.me.batch);});
  if(f==='My State') it=it.filter(r=>refObj(r).state===S.me.state);
  if(f==='Following') it=it.filter(r=>{const a=refAuthor(r);return a&&(a==='me'||S.following.has(a));});
  if(f==='For You') it=it.map((r,i)=>({r,k:(r.k==='post'&&refObj(r).type==='announcement')?i-50:(S.following.has(refAuthor(r))?i-2.5:i)})).sort((a,b)=>a.k-b.k).map(x=>x.r);
  return it;
}
function feedItem(r){return r.k==='post'?postCard(POSTS[r.id]):r.k==='listing'?listingCard(LISTINGS[r.id]):eventCard(EVENTS[r.id]);}
function verifBanner(){
  const m={unverified:['Get verified to unlock everything','Official communities, listings and events need verification.'],pending:['Verification in review','Usually within 48 hours. Some features stay locked until then.'],rejected:['Verification needs attention','See why and resubmit.']}[S.verif];
  if(!m) return '';
  return `<div style="padding:4px 12px 10px"><button class="card" data-a="go" data-s="verification" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:1px solid #FF8A3D;background:transparent;padding:12px 14px">${I(S.verif==='pending'?'clock':'shield',22,'style="color:#FF8A3D"')}<span style="flex:1"><b style="display:block;font-size:14px">${m[0]}</b><span class="hint">${m[1]}</span></span>${I('chevR',18)}</button></div>`;
}
function campToday(){
  return `<div style="padding:0 12px 12px"><div class="card" style="padding:14px 0 14px 14px"><div class="row" style="padding-right:14px;justify-content:space-between"><span class="hd" style="font-weight:700;font-size:16px">Today at camp</span><span class="hint">Shared by camp admins</span></div>
  <div class="chips" style="padding:10px 14px 0 0">${CAMP_TODAY.map(([t,a],i)=>`<div style="flex:none;background:${i===3?'#FF8A3D':'#232927'};color:${i===3?'#0F1211':'#F2F4EF'};border-radius:16px;padding:10px 12px;min-width:120px"><div style="font-size:12px;font-weight:700;opacity:.85">${t}</div><div style="font-weight:600;font-size:14px;margin-top:2px">${a}</div></div>`).join('')}</div></div></div>`;
}
SC.home=()=>{
  const me=S.me,unread=NOTIF.some(n=>!n.read);
  const label={'Awaiting deployment':'Awaiting deployment','In camp':`Day 4 · ${me.state} camp`,'Serving':`Serving · ${me.state}`,'Completed':`Alumni · ${shortBatch(me.batch)}`}[me.status];
  const items=homeItems();
  const emp={'Following':empty('Nothing from people you follow yet','Follow corpers from your camp and state to see their posts here.',`<button class="btn sm lime" data-a="tab" data-t="explore">Find people</button>`),'My Batch':empty('Quiet in your batch','Be the first to post something.'),'My State':empty('Nothing in '+esc(me.state)+' yet','Check Explore to see what’s happening nationwide.')}[S.homeFilter]||empty('No posts yet','');
  return `<div class="scroll">
  <header style="display:flex;align-items:center;gap:8px;padding:18px 16px 8px">
    <div style="flex:1;min-width:0"><div class="eyebrow">${esc(label)}</div><div class="hd" style="font-weight:700;font-size:28px;margin-top:2px">Oya, what’s up?</div></div>
    <button class="ib" data-a="tab" data-t="explore" aria-label="Search">${I('search')}</button>
    <button class="ib" data-a="go" data-s="notifications" aria-label="Notifications${unread?', unread':''}">${I('bell')}${unread?'<span class="dot"></span>':''}</button>
  </header>
  ${verifBanner()}
  ${chips(['For You','My Batch','My State','Following'],S.homeFilter,'homeFilter')}
  ${S.homeFilter==='For You'&&me.status==='In camp'?campToday():''}
  <div class="pad stack">${items.length?items.map(feedItem).join(''):emp}</div>
  ${items.length?'<div class="empty" style="padding:24px">You’re all caught up.</div>':''}
  </div>${nav('home')}`;
};

// ===== Post detail =====
SC.post=t=>{const p=POSTS[t.id];if(!p||p.deleted)return `${tb('Post')}${empty('This post is no longer available','It may have been removed.')}`;
  const cs=p.comments||[];
  return `${tb(p.type==='poll'?'Poll':p.type==='question'?'Question':p.type==='discussion'?'Discussion':'Post')}
  <div class="scroll" style="padding-bottom:96px"><div class="pad">${postCard(p,true)}
  ${p.community?`<button class="row" data-a="go" data-s="communityDetail" data-id="${p.community}" style="margin:10px 4px 0;font-size:13px;color:#A3ABA5;min-height:36px">${I('users',14)}Posted in <b style="color:#F2F4EF">${esc(COMM[p.community].name)}</b></button>`:''}
  ${p.type==='announcement'?'':`<div class="sec" style="padding-top:14px">Comments · ${p.cc}</div>
  ${cs.length?cs.map((c,i)=>{const u=user(c.u);return `<div class="row" style="align-items:flex-start;gap:10px;padding:12px 0 0">
    <button data-a="openUser" data-id="${c.u}" aria-label="${esc(u.name)}">${av(u,36)}</button>
    <div style="flex:1;min-width:0"><div style="background:#1A1F1D;border-radius:4px 18px 18px 18px;padding:10px 12px"><div style="font-weight:600;font-size:13px;display:flex;gap:4px;align-items:center">${esc(u.name)}${vb(u,13)}</div><div style="font-size:14px;line-height:1.45;margin-top:2px;word-wrap:break-word">${esc(c.t)}</div></div>
    <div class="row" style="gap:16px;font-size:12px;color:#A3ABA5;padding:4px 4px 0"><span>${c.time}</span><button data-a="likeComment" data-id="${p.id}" data-i="${i}" style="font-weight:700;min-height:32px;color:${c.liked?'#FF8A3D':'#A3ABA5'}">${c.liked?'Liked':'Like'}${c.likes?' · '+c.likes:''}</button>${c.u==='me'?`<button data-a="delComment" data-id="${p.id}" data-i="${i}" style="font-weight:700;min-height:32px">Delete</button>`:`<button data-a="report" data-kind="comment" data-id="${p.id}" style="font-weight:700;min-height:32px">Report</button>`}</div></div></div>`;}).join(''):empty('No comments yet','Start the conversation.')}
  ${p.cc>cs.length&&cs.length?`<div class="hint" style="padding:14px 4px">Showing the most recent comments.</div>`:''}`}
  </div></div>
  ${p.type==='announcement'?'':`<div class="bottombar row" style="gap:8px">${av(S.me,36)}<label for="f-comment" class="vh">Add a comment</label><input class="inp" style="height:44px;border-radius:22px" id="f-comment" data-k="comment" data-enter="addComment" data-id="${p.id}" placeholder="Add a comment…" value="${esc(S.draft.comment||'')}"><button class="ib lime" data-a="addComment" data-id="${p.id}" aria-label="Send comment">${I('send',18)}</button></div>`}`;};
INIT.post=()=>{S.draft={comment:''};};

// ===== Community =====
SC.community=()=>{
  const joined=Object.values(COMM).filter(c=>c.joined);
  const offJ=joined.filter(c=>c.official),mine=joined.filter(c=>!c.official);
  const lockedOff=Object.values(COMM).filter(c=>c.official&&!c.joined);
  return `${tb('Communities',{back:false,right:`<button class="ib lime" data-a="newCommunity" aria-label="Create a community">${I('plus',22)}</button>`})}
  <div class="scroll"><div class="pad stack">
  ${seg(['Joined','Discover'],S.commView,'commView')}
  ${S.commView==='Joined'?`
    ${lockedOff.length&&!verified()?`<button class="card" data-a="go" data-s="verification" style="text-align:left;border:1px dashed #4A5450;background:transparent;display:flex;gap:12px;align-items:center">${I('lock',22,'style="color:#FF8A3D"')}<span style="flex:1"><b style="display:block;font-size:14px">${lockedOff.length} official communities waiting</b><span class="hint">Your batch, camp and state spaces open after verification.</span></span>${I('chevR',18)}</button>`:''}
    ${offJ.length?`<div class="sec">Official</div>${offJ.map(c=>commRow(c)).join('')}`:''}
    <div class="sec">Your communities</div>
    ${mine.length?mine.map(c=>commRow(c)).join(''):empty('You haven’t joined any yet','Find people who share your interests, sport or state.',`<button class="btn sm lime" data-a="commView" data-v="Discover">Discover communities</button>`)}`
  :`<div style="position:relative"><span style="position:absolute;left:14px;top:15px;color:#A3ABA5">${I('search',20)}</span><label for="f-cq" class="vh">Search communities</label><input class="inp" id="f-cq" type="search" data-live="commQ" value="${esc(S.commQ)}" placeholder="Search communities" style="padding-left:44px"></div>
    <div style="margin:0 -12px">${chips(['All',...CATEGORIES],S.commCat,'commCat')}</div>
    <div id="commResults" class="stack">${commResults()}</div>`}
  </div></div>${nav('community')}`;
};
function commResults(){
  const q=S.commQ.toLowerCase().trim();
  const r=Object.values(COMM).filter(c=>(S.commCat==='All'||c.category===S.commCat)&&(!q||(c.name+' '+c.desc+' '+c.sub).toLowerCase().includes(q)));
  return r.length?r.map(c=>commRow(c)).join(''):empty('No communities found','Try another search, or create one yourself.',`<button class="btn sm lime" data-a="newCommunity">Create a community</button>`);
}
SC.communityDetail=t=>{const c=COMM[t.id];const tab=S.commTab[c.id]||'Feed';
  const posts=FEED.filter(r=>r.k==='post'&&refOk(r)&&POSTS[r.id].community===c.id).map(r=>POSTS[r.id]);
  let body='';
  if(tab==='Feed'||tab==='Discussions'){
    const list=tab==='Feed'?posts:posts.filter(p=>p.type==='discussion'||p.type==='question');
    body=`${c.joined?`<button class="card row" data-a="create" data-comm="${c.id}" style="width:100%;text-align:left;padding:10px 12px;color:#A3ABA5;font-size:14px">${av(S.me,36)}<span style="flex:1">Share something with ${esc(c.name)}…</span>${I('image',20)}</button>`:''}
      ${list.length?list.map(p=>postCard(p)).join(''):empty(tab==='Feed'?'No posts yet':'No discussions yet',c.joined?'Start one from the box above.':'Join to start posting.')}`;
  } else if(tab==='Members'){
    const mods=[...(c.admin==='me'?['me']:[]),...c.mods];
    const others=Object.keys(USERS).filter(u=>!mods.includes(u)).slice(0,5);
    body=`<div class="sec">Admins & moderators</div>${mods.map(id=>{const u=user(id);return `<div class="card row" style="padding:12px"><button data-a="openUser" data-id="${id}" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left">${av(u,44)}<span style="min-width:0"><span style="display:flex;gap:5px;align-items:center;font-weight:600">${esc(u.name)}${vb(u,14)}</span><span class="hint">${id==='me'?'Admin (creator)':'Moderator'} · ${shortBatch(u.batch)}</span></span></button><span class="tag ${id==='me'?'lime':'line'}">${id==='me'?'Admin':'Mod'}</span></div>`;}).join('')}
      <div class="hint" style="padding:2px 4px">Moderators are corps members appointed by the platform. They are not NYSC officials.</div>
      <div class="sec">Members · ${c.members.toLocaleString()}</div>${others.map(id=>userRow(USERS[id])).join('')}
      <div class="hint" style="text-align:center;padding:8px">+ ${(c.members-others.length-mods.length).toLocaleString()} more</div>`;
  } else if(tab==='Pinned'){
    body=c.pinned.length?c.pinned.map(x=>`<div class="card" style="display:flex;gap:12px;border:1px dashed #4A5450;background:transparent">${I('pin',20,'style="color:#FF8A3D"')}<div><span class="tag orange">Moderator notice</span><div style="font-size:15px;line-height:1.45;margin-top:4px">${esc(x)}</div></div></div>`).join(''):empty('Nothing pinned','');
  } else {

const CT={photo:'Photo or video',discussion:'Start a discussion',question:'Ask a question',poll:'Create a poll',sell:'Sell an item',accommodation:'List accommodation',event:'Create an event'};
INIT.compose=p=>{S.draft={photos:[],dest:p.comm||'feed',alsoFeed:!p.comm,vis:'Public',optCount:2,duration:'1 day',condition:'Fairly used',state:S.me.state,type:'Self-contain',period:'/ year',fees:1,fee0l:'Agency fee',wa:true,call:false,phone:'',organiser:'me',time:'16:00'};};
function photoPicker(label,req,single){const d=S.draft;
  return `<div class="field"><span class="flabel">${label}${req?'':' <span class="muted" style="font-weight:500">(optional)</span>'}</span>
  <div class="chips" style="padding:0">${d.photos.map((u,i)=>`<span style="position:relative;flex:none"><span class="ph" style="width:${single?150:96}px;height:96px"><img src="${u}" alt="Selected photo ${i+1}"></span><button class="ib" style="position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:10px;background:rgba(15,18,17,.85)" data-a="rmPhoto" data-i="${i}" aria-label="Remove photo ${i+1}">${I('x',14)}</button></span>`).join('')}
  ${single&&d.photos.length?'':`<label for="cphotos" class="ph" style="width:96px;height:96px;border:1.5px dashed ${S.errors.photos?'#FF8A3D':'#4A5450'};background:transparent;color:#A3ABA5;flex-direction:column;gap:4px;font-size:12px;font-weight:600;cursor:pointer">${I('camera',22)}Add</label>`}</div>
  <input id="cphotos" type="file" accept="image/*" ${single?'':'multiple'} class="vh" data-file="composePhotos">${S.errors.photos?`<span class="err">${S.errors.photos}</span>`:''}</div>`;}
function destFields(){const d=S.draft;const joined=Object.values(COMM).filter(c=>c.joined);
  const inComm=d.dest!=='feed';const commOnly=inComm&&!d.alsoFeed;
  const vis=commOnly?'Community':(d.vis==='Community'?'Public':d.vis);

  ${inComm?`<div class="list">${swRow('alsoFeed','Also share to my Home feed','Followers and Explore can see it too',d.alsoFeed)}</div>`:''}
  <div class="field"><span class="flabel">Who can see this</span>${commOnly?`<div class="card row" style="padding:12px 14px;font-size:14px">${I('users',18,'style="color:#C8F169"')}Members of ${esc(COMM[d.dest].name)} only</div>`:seg(['Public','Followers'],vis,'setDraft','data-k="vis"')}
  <span class="hint">${commOnly?'It won’t appear in public search.':vis==='Public'?'Anyone can discover it in Explore across Nigeria.':'Only people who follow you.'}</span></div>`;}
function contactFields(){const d=S.draft;
  return `<div class="field"><span class="flabel">How people can reach you</span><div class="list">${swRow('wa','WhatsApp','Opens a chat with a pre-filled message',d.wa)}${swRow('call','Phone call','Shows your number when someone taps Call',d.call)}</div>${S.errors.contact?`<span class="err">${S.errors.contact}</span>`:''}<span class="hint">There’s no in-app chat. Your number is never shown on your profile.</span></div>
  ${fld('phone','Phone number for this listing',{type:'tel',prefix:'+234',prefixW:62,ph:'803 000 0000',attrs:'inputmode="tel"'})}`;}
SC.compose=t=>{const ty=t.t,d=S.draft;let f='';
  if(ty==='photo') f=photoPicker('Photos',true)+fld('text','Caption',{area:true,ph:'What’s happening?'})+fld('loc','Location',{opt:true,ph:'e.g. Parade ground',hint:'Shown as a general place, never your exact location.'})+destFields();
  if(ty==='discussion') f=fld('title','Title',{ph:'What do you want to talk about?',attrs:'maxlength="100"'})+fld('text','Details',{area:true,ph:'Share your thoughts, context or a story.'})+photoPicker('Photos',false)+destFields();
  if(ty==='question') f=fld('text','Your question',{area:true,ph:'e.g. Can we still change platoons after Wednesday?',hint:'Clear questions get better answers. Add your state or camp if it matters.'})+photoPicker('Supporting photo',false)+destFields();
  if(ty==='poll'){f=fld('text','Question',{ph:'e.g. Best spot at Mammy Market?',attrs:'maxlength="120"'})+`<div class="field"><span class="flabel">Options</span><div class="stack" style="gap:8px">${Array.from({length:d.optCount},(_,i)=>`<div class="row" style="gap:8px"><label for="f-opt${i}" class="vh">Option ${i+1}</label><input class="inp ${S.errors['opt'+i]?'bad':''}" id="f-opt${i}" data-k="opt${i}" value="${esc(d['opt'+i]||'')}" placeholder="Option ${i+1}" maxlength="40">${i>=2?`<button class="ib" data-a="rmOpt" data-i="${i}" aria-label="Remove option ${i+1}">${I('x',18)}</button>`:''}</div>`).join('')}</div>${S.errors.opts?`<span class="err">${S.errors.opts}</span>`:''}${d.optCount<5?`<button class="btn sm dark" style="align-self:flex-start;margin-top:4px" data-a="addOpt">${I('plus',16)}Add option</button>`:''}</div>`+fld('duration','Poll length',{opts:['1 day','3 days','1 week']})+`<div class="hint">One vote per member. Moderator elections use a separate, controlled process.</div>`+destFields();}
  if(ty==='sell') f=photoPicker('Photos',true)+fld('title','What are you selling?',{ph:'e.g. Rechargeable fan',attrs:'maxlength="60"'})+`<div class="grid2">${fld('price','Price',{type:'number',prefix:'₦',prefixW:30,ph:'0',attrs:'inputmode="numeric" min="0"'})}${fld('condition','Condition',{opts:['New','Like new','Fairly used','Used']})}</div>`+fld('text','Description',{area:true,ph:'Size, age, any faults, pick-up details…'})+`<div class="grid2">${fld('state','State',{opts:STATES})}${fld('area','Area',{ph:'e.g. Kano Municipal'})}</div>`+contactFields();
  if(ty==='accommodation'){f=photoPicker('Photos',true)+fld('title','Title',{ph:'e.g. Self-contain near Gwarzo Road',attrs:'maxlength="60"'})+fld('type','Type',{opts:['Self-contain','Room in shared flat','Mini flat','1-bedroom flat','Hostel or lodge','Roommate wanted']})
    +`<div class="card" style="padding:14px"><div class="hd" style="font-weight:700;font-size:16px;margin-bottom:10px">Rent and fees</div><div class="grid2">${fld('price','Rent',{type:'number',prefix:'₦',prefixW:30,ph:'0',attrs:'inputmode="numeric"'})}${fld('period','Paid',{opts:[['/ year','Per year'],['/ month','Per month']]})}</div>
    <div class="flabel" style="margin:14px 0 6px">One-off fees</div><div class="stack" style="gap:8px">${Array.from({length:d.fees},(_,i)=>`<div class="row" style="gap:8px"><label class="vh" for="f-fee${i}l">Fee name</label><input class="inp" id="f-fee${i}l" data-k="fee${i}l" value="${esc(d['fee'+i+'l']||'')}" placeholder="e.g. Caution fee" style="flex:1.2"><label class="vh" for="f-fee${i}a">Amount</label><input class="inp" id="f-fee${i}a" data-k="fee${i}a" type="number" inputmode="numeric" value="${esc(d['fee'+i+'a']||'')}" placeholder="₦ 0" style="flex:1"><button class="ib" data-a="rmFee" data-i="${i}" aria-label="Remove fee">${I('x',18)}</button></div>`).join('')}</div>
    <button class="btn sm dark" style="margin-top:8px" data-a="addFee">${I('plus',16)}Add a fee</button><div class="hint" style="margin-top:8px">Rent is paid every period. Fees are one-off: agency, caution, legal and so on. Keeping them separate helps people avoid surprises.</div></div>`
    +fld('avail','Available from',{ph:'e.g. 15 December or Now'})+fld('text','Description',{area:true,ph:'Water, light, distance to landmarks, what stays behind…'})+`<div class="grid2">${fld('state','State',{opts:STATES})}${fld('area','Area or LGA',{ph:'e.g. Ikeja'})}</div>`+contactFields()
    +`<div class="card row" style="background:transparent;border:1px solid #FF8A3D;font-size:13px;align-items:flex-start">${I('shield',18,'style="color:#FF8A3D;margin-top:1px"')}<span>Only list places you’re allowed to rent or hand over. Listings reported as scams are reviewed first.</span></div>`;}
  if(ty==='event'){const comms=S.myComms.map(id=>COMM[id]);f=photoPicker('Cover image',false,true)+fld('title','Event name',{ph:'e.g. Batch B Kano meetup',attrs:'maxlength="70"'})+fld('text','What’s happening?',{area:true,ph:'Who it’s for, what to bring, what to expect.'})+`<div class="grid2">${fld('date','Date',{type:'date'})}${fld('time','Time',{type:'time'})}</div>`+fld('loc','Location',{ph:'Venue or landmark'})+fld('state','State',{opts:STATES})+fld('organiser','Organised by',{opts:[['me','Me ('+S.me.name+')'],...comms.map(c=>[c.id,c.name])]})+fld('link','Registration link',{type:'url',opt:true,ph:'https://',hint:'No tickets or payments in the app. Add an external link if you need sign-ups.'});}
  return `${tb(CT[ty],{close:true})}<div class="scroll" style="padding-bottom:100px"><div class="pad stack" style="gap:16px">
  <div class="row" style="gap:10px">${av(S.me,40)}<span><b style="display:flex;gap:4px;align-items:center">${esc(S.me.name)}${vb(S.me,14)}</b><span class="hint">${shortBatch(S.me.batch)} · ${esc(S.me.state)}</span></span></div>
  ${f}</div></div><div class="bottombar"><button class="btn lime block" data-a="publish" data-t="${ty}">${ty==='sell'||ty==='accommodation'?'Publish listing':ty==='event'?'Publish event':'Post'}</button></div>`;};

SC.explore=()=>`${tb('Explore',{back:false,right:`<span class="tag line" style="height:32px">${I('globe',13)}All of Nigeria</span>`})}
  <div class="scroll"><div class="pad" style="padding-bottom:10px"><div style="position:relative"><span style="position:absolute;left:14px;top:15px;color:#A3ABA5">${I('search',20)}</span><label for="f-q" class="vh">Search</label><input class="inp" id="f-q" type="search" data-live="exploreQ" value="${esc(S.q)}" placeholder="Search people, posts, places, listings…" style="padding-left:44px"></div></div>
  <div id="exResults">${exploreBody()}</div></div>${nav('explore')}`;
function stateOk(s){return S.exploreState==='All'||s===S.exploreState;}
function priceOk(p){return S.explorePrice==='Any'||(S.explorePrice==='lt20'&&p<20000)||(S.explorePrice==='mid'&&p>=20000&&p<=200000)||(S.explorePrice==='gt200'&&p>200000);}
function exFilters(withPrice){
  return `<div class="row pad" style="gap:8px;margin-bottom:12px">
  <label class="vh" for="exs">State</label><select id="exs" class="inp" data-c="exState" style="height:42px;border-radius:21px;font-size:13px;flex:1">${[['All','All of Nigeria'],...STATES.map(s=>[s,s])].map(([v,l])=>`<option value="${v}" ${S.exploreState===v?'selected':''}>${l}</option>`).join('')}</select>
  ${withPrice?`<label class="vh" for="exp">Price</label><select id="exp" class="inp" data-c="exPrice" style="height:42px;border-radius:21px;font-size:13px;flex:1">${[['Any','Any price'],['lt20','Under ₦20,000'],['mid','₦20k – ₦200k'],['gt200','Over ₦200,000']].map(([v,l])=>`<option value="${v}" ${S.explorePrice===v?'selected':''}>${l}</option>`).join('')}</select>
  <button class="chip ${S.availOnly?'on':''}" data-a="toggleAvail" aria-pressed="${!!S.availOnly}" style="height:42px;padding:0 12px">Available</button>`:''}</div>`;
}
function exploreBody(){
  const q=S.q.toLowerCase().trim();
  if(q) return searchResults(q);
  const tab=S.exploreTab;let body='';
  const lst=k=>Object.values(LISTINGS).filter(l=>!l.deleted&&l.kind===k&&stateOk(l.state)&&priceOk(l.price)&&(!S.availOnly||l.status==='Available')&&!hiddenAuthor(l.owner));
  if(tab==='Trending'){
    const top=Object.values(POSTS).filter(p=>p.type!=='announcement'&&!p.deleted&&!hiddenAuthor(p.author)&&p.vis!=='Followers'&&p.vis!=='Community').sort((a,b)=>b.likes-a.likes).slice(0,4);
    body=`<div class="pad stack"><div class="card" style="padding:6px 4px"><div class="hd" style="font-weight:700;font-size:17px;padding:10px 12px 4px">Trending across Nigeria</div>${TRENDING.map(([h,c],i)=>`<button class="li" data-a="setQ" data-v="${h.slice(1)}" style="border-color:#232927"><span class="hd" style="width:26px;color:#A3ABA5;font-weight:700">${i+1}</span><span class="t"><b>${h}</b><span>${c}</span></span>${I('trend',18,'style="color:#C8F169"')}</button>`).join('')}</div>
    <div class="sec">Popular posts</div>${top.map(p=>postCard(p)).join('')}</div>`;
  } else if(tab==='Nationwide'){
    const ps=Object.values(POSTS).filter(p=>p.type!=='announcement'&&!p.deleted&&p.state&&p.state!==S.me.state&&stateOk(p.state)&&!hiddenAuthor(p.author));
    body=exFilters(false)+`<div class="pad stack"><div class="hint" style="padding:0 4px">Posts from outside ${esc(S.me.state)}. Pick a state to narrow it down, for example before a redeployment.</div>${ps.length?ps.map(p=>`<div><div class="row" style="gap:6px;font-size:12px;color:#A3ABA5;padding:0 6px 6px">${I('mappin',13)}${esc(p.state)}</div>${postCard(p)}</div>`).join(''):empty('Nothing from this state yet','Try another state.')}</div>`;
  } else if(tab==='Marketplace'){
    const l=lst('item');body=exFilters(true)+`<div class="pad">${l.length?`<div class="grid2">${l.map(itemTile).join('')}</div>`:empty('No items match','Try a different state or price.')}</div>`;
  } else if(tab==='Accommodation'){
    const l=lst('accommodation');body=exFilters(true)+`<div class="pad stack">${l.length?l.map(listingCard).join(''):empty('No places match','Try a different state or price.')}</div>`;
  } else if(tab==='Events'){
    const e=Object.values(EVENTS).filter(e=>!e.deleted&&stateOk(e.state)&&!hiddenAuthor(e.organiser));body=exFilters(false)+`<div class="pad stack">${e.length?e.map(eventCard).join(''):empty('No events here yet','Organise one from the Create button.')}</div>`;
  } else if(tab==='Communities'){
    body=`<div class="pad stack">${Object.values(COMM).map(c=>commRow(c)).join('')}</div>`;
  } else if(tab==='People'){
    const u=Object.values(USERS).filter(u=>stateOk(u.state)&&!S.blocked.has(u.id));body=exFilters(false)+`<div class="pad stack">${u.length?u.map(userRow).join(''):empty('No one found','Try another state.')}</div>`;
  }
  return chips(['Trending','Nationwide','Marketplace','Accommodation','Events','Communities','People'],tab,'exTab')+body;
}
function searchResults(q){
  const m=s=>String(s||'').toLowerCase().includes(q);
  const ppl=Object.values(USERS).filter(u=>!S.blocked.has(u.id)&&(m(u.name)||m(u.username)||m(u.state)));
  const com=Object.values(COMM).filter(c=>m(c.name)||m(c.desc)||m(c.category));
  const pos=Object.values(POSTS).filter(p=>!p.deleted&&!hiddenAuthor(p.author)&&p.vis!=='Followers'&&p.vis!=='Community'&&(m(p.text)||m(p.title)));
  const lis=Object.values(LISTINGS).filter(l=>!l.deleted&&(m(l.title)||m(l.desc)||m(l.area)||m(l.state)));
  const evs=Object.values(EVENTS).filter(e=>!e.deleted&&(m(e.title)||m(e.location)||m(e.state)));
  const pl=STATES.filter(s=>m(s));
  if(!ppl.length&&!com.length&&!pos.length&&!lis.length&&!evs.length&&!pl.length) return empty(`No results for “${esc(S.q)}”`,'Check the spelling or try a broader word.');
  const sec=(t,h)=>h?`<div class="sec">${t}</div>${h}`:'';
  return `<div class="pad stack">
  ${sec('Places',pl.slice(0,3).map(s=>`<button class="card row" data-a="exPlace" data-v="${s}" style="width:100%;text-align:left;padding:12px">${I('mappin',20,'style="color:#C8F169"')}<span style="flex:1"><b>${s}</b><span class="hint" style="display:block">Accommodation, items, events and people in ${s}</span></span>${I('chevR',18)}</button>`).join(''))}
  ${sec('People',ppl.slice(0,3).map(userRow).join(''))}
  ${sec('Communities',com.slice(0,3).map(c=>commRow(c)).join(''))}
  ${sec('Listings',lis.slice(0,4).map(listingCard).join(''))}
  ${sec('Events',evs.slice(0,3).map(eventCard).join(''))}
  ${sec('Posts',pos.slice(0,4).map(p=>postCard(p)).join(''))}</div>`;
}

// ===== Listing detail =====
SC.listing=t=>{const l=LISTINGS[t.id];if(!l||l.deleted)return `${tb('Listing')}${empty('Listing removed','')}`;
  const o=user(l.owner),mine=l.owner==='me',acc=l.kind==='accommodation';
  const n=l.photos&&l.photos.length?l.photos.length:3;

    <div style="position:absolute;left:12px;bottom:12px;display:flex;gap:6px">${statusPill(l.status).replace('padding:2px 7px','padding:5px 10px')}<span class="tag" style="background:rgba(15,18,17,.75);color:#F2F4EF;padding:5px 10px">${idx+1} / ${n}</span></div>
    ${n>1?`<button class="ib" style="position:absolute;right:12px;bottom:10px;background:rgba(15,18,17,.75);color:#F2F4EF;width:40px;height:40px" data-a="nextPhoto" data-id="${l.id}" data-n="${n}" aria-label="Next photo">${I('chevR',18)}</button>`:''}
  </div>
  <div style="padding:4px 18px 0" class="stack">
    <div><div class="eyebrow" style="color:#FF8A3D;font-weight:700">${acc?esc(l.type):'For sale · '+esc(l.condition)} · ${esc(l.area)}</div>
    <h1 class="hd" style="margin:6px 0 0;font-weight:700;font-size:28px;letter-spacing:-.8px;line-height:1.05">${esc(l.title)}</h1></div>
    ${acc?`<div class="card" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="hint">Rent ${l.unit==='/ month'?'per month':'per year'}</div><div class="hd" style="font-weight:700;font-size:32px;color:#C8F169;line-height:1.05">${naira(l.price)}</div></div><span class="tag line">Recurring</span></div>
      ${l.fees.length?`<div style="border-top:1px solid #2F3633;margin-top:12px;padding-top:10px" class="stack">${l.fees.map(([a,b])=>`<div class="row" style="justify-content:space-between;font-size:14px"><span class="muted">${esc(a)} <span style="font-size:12px">(one-off)</span></span><b>${naira(b)}</b></div>`).join('')}<div class="row" style="justify-content:space-between;font-size:14px;border-top:1px dashed #2F3633;padding-top:8px"><span>Total to move in</span><b class="hd" style="font-size:17px">${naira(l.price+l.fees.reduce((a,f)=>a+f[1],0))}</b></div></div>`:''}</div>`
    :`<div class="hd" style="font-weight:700;font-size:34px;color:#C8F169;line-height:1">${naira(l.price)}</div>`}
    <div class="row" style="gap:8px">
      <button class="pill ${l.liked?'on-like':''}" data-a="likeListing" data-id="${l.id}" aria-pressed="${l.liked}">${I('heart',18,l.liked?'style="fill:currentColor"':'')}${l.likes}</button>
      <button class="pill" data-a="share" data-kind="listing" data-id="${l.id}">${I('repost',18)}Share</button>
      <button class="pill ${l.saved?'on-lime':''}" data-a="saveListing" data-id="${l.id}" aria-pressed="${l.saved}">${I('bookmark',18)}${l.saved?'Saved':'Save'}</button>
      <span class="hint" style="margin-left:auto">No comments on listings</span></div>
    <div class="list">${li({icon:'mappin',title:esc(l.area)+', '+esc(l.state),sub:'Exact address shared by the advertiser'})}${acc?li({icon:'cal',title:'Available '+esc(l.avail),sub:esc(l.type)}):li({icon:'bag',title:esc(l.condition),sub:'Condition'})}${li({icon:'clock',title:'Listed '+esc(l.date)})}</div>
    <button class="card row" data-a="openUser" data-id="${l.owner}" style="width:100%;text-align:left;padding:12px">${av(o,46)}<span style="flex:1;min-width:0"><b style="display:flex;gap:5px;align-items:center;font-size:15px">${esc(o.name)}${mine?' (you)':''}</b><span style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:${(mine?verified():o.verified)?'#C8F169':'#FFA27F'}">${(mine?verified():o.verified)?vb(o,13)+'Verified corps member':I('info',13)+'Not verified'}</span></span>${I('chevR',18)}</button>
    <p style="margin:0;font-size:15px;line-height:1.55;color:#D3D8D4">${esc(l.desc)}</p>
    <div style="border:1px solid #FF8A3D;border-radius:20px;padding:14px"><div class="row" style="gap:8px;color:#FF8A3D;font-weight:700">${I('shield',18)}${acc?'See it before you pay':'Stay safe'}</div><ul style="margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:#E4E8E5">${tips.map(x=>`<li>${x}</li>`).join('')}</ul><div class="hint" style="margin-top:8px">The verified badge confirms NYSC membership, not ownership of the property or item.</div></div>
    ${mine?'':`<button class="btn block" style="color:#FFA27F" data-a="report" data-kind="listing" data-id="${l.id}">${I('flag',18)}Report listing</button>`}
  </div></div>
  <div style="position:absolute;left:12px;right:12px;bottom:18px;display:flex;gap:8px;padding:8px;border-radius:30px;background:#232927;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:4">
  ${mine?`<button class="btn dark" style="flex:1;background:#2F3633" data-a="listingManage" data-id="${l.id}">${I('edit',18)}Manage</button><button class="btn lime" style="flex:1.3" data-a="quickStatus" data-id="${l.id}">${l.status==='Available'?(acc?'Mark rented':'Mark sold'):'Mark available'}</button>`
  :l.status!=='Available'?`<div class="btn" style="flex:1;color:#A3ABA5">This listing is ${l.status.toLowerCase()}</div>`
  :`${l.contact.call?`<button class="ib" style="width:52px;height:52px;border-radius:26px;background:#2F3633" data-a="contact" data-m="call" data-id="${l.id}" aria-label="Call">${I('phone')}</button>`:''}${l.contact.wa?`<button class="btn lime" style="flex:1" data-a="contact" data-m="wa" data-id="${l.id}">${I('comment')}Chat on WhatsApp</button>`:`<button class="btn lime" style="flex:1" data-a="contact" data-m="call" data-id="${l.id}">${I('phone')}Call ${esc(first(o))}</button>`}`}
  </div>`;};

// ===== Event detail =====

  const o=user(e.organiser),mine=e.organiser==='me',off=e.status!=='Upcoming';

    <div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between"><button class="ib" style="background:rgba(15,18,17,.75);color:#F2F4EF" data-a="back" aria-label="Back">${I('back')}</button><button class="ib" style="background:rgba(15,18,17,.75);color:#F2F4EF" data-a="share" data-kind="event" data-id="${e.id}" aria-label="Share">${I('share')}</button></div>
    <div style="position:absolute;left:12px;bottom:12px;width:62px;height:70px;border-radius:18px;background:${off?'#2F3633':'#C8F169'};color:${off?'#A3ABA5':'#0F1211'};display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="hd" style="font-size:26px;font-weight:700;line-height:1">${e.day}</span><span style="font-size:11px;font-weight:800;letter-spacing:1px">${e.mon}</span></div></div>

// ===== Profile =====
function journey(u,own){
  const order=['Awaiting deployment','In camp','Serving','Completed'],ix=order.indexOf(u.status);
  const vOk=own?verified():u.verified;
  const ms=[['Registered for NYSC',shortBatch(u.batch),true],['Received deployment',`Posted to ${u.state}`,ix>=1],['Reported to camp',u.camp||`${u.state} Orientation Camp`,ix>=1],['Completed orientation','Sworn in',ix>=2],['Posted to PPA','Details kept private',ix>=2]];
  (u.history||[]).forEach(h=>ms.push(['Redeployed',`${h.from} → ${h.to}`,true]));
  ms.push(['Completed service','Passed out',ix>=3]);
  const html=ms.map(([t,s,done])=>`<div class="m ${done&&vOk?'v':''}"><div class="row" style="gap:8px;flex-wrap:wrap"><b style="font-size:15px;${done?'':'color:#7D8681'}">${t}</b>${done?(vOk?'<span class="tag lime" style="padding:2px 6px;font-size:10px">Verified</span>':'<span class="tag grey" style="padding:2px 6px;font-size:10px">Self-reported</span>'):'<span class="tag line" style="padding:2px 6px;font-size:10px">Up next</span>'}</div><div class="hint">${esc(s)}</div></div>`).join('');
  const pers=(own?S.me.milestones:[]).map(m=>`<div class="m p"><div class="row" style="gap:8px"><b style="font-size:15px">${esc(m.t)}</b><span class="tag" style="border:1px solid #FF8A3D;color:#FF8A3D;padding:2px 6px;font-size:10px">Personal</span></div><div class="hint">${esc(m.d)}</div></div>`).join('');
  const pend=own&&S.me.redeploy?`<div class="m p"><b style="font-size:15px">Redeployment to ${esc(S.me.redeploy.state)}</b><div class="hint">Under review</div></div>`:'';
  return `<div class="card" style="padding:18px 16px 2px"><div class="tl">${html}${pend}${pers}</div></div>
  ${own?`<div class="row" style="gap:8px"><button class="btn dark" style="flex:1" data-a="milestoneAdd">${I('plus',18)}Add milestone</button><button class="btn dark" style="flex:1" data-a="go" data-s="service">${I('swap',18)}Service info</button></div><div class="hint" style="padding:0 4px">Verified milestones come from your confirmed NYSC details. Personal ones are added by you and labelled.</div>`:''}`;
}
function profileHeader(u,own){
  const f=S.following.has(u.id);
  const vtag=own?{verified:'<span class="tag lime">'+I('check',12)+'Verified</span>',pending:'<span class="tag oranges">Pending</span>',rejected:'<span class="tag oranges">Action needed</span>',unverified:'<span class="tag grey">Unverified</span>'}[S.verif]:(u.verified?'<span class="tag lime">'+I('check',12)+'Verified</span>':'<span class="tag grey">Unverified</span>');
  const st=S.settings;
  const meta=[];
  meta.push([I('award',14),`${esc(u.batch)}${u.stream?' · '+esc(u.stream):''}`,own&&!st.showBatch]);
  if(u.camp&&u.status!=='Awaiting deployment') meta.push([I('building',14),esc(u.camp),own&&!st.showBatch]);
  meta.push([I('mappin',14),esc(u.state)+(u.lga?' · '+esc(u.lga):''),own&&!st.showState]);
  return `<div class="pad"><div class="card" style="padding:18px;position:relative;overflow:hidden">
    <div style="position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:85px;background:${u.color};opacity:.14" aria-hidden="true"></div>
    <div class="row" style="gap:16px;position:relative">${av(u,84)}
      <div class="row" style="flex:1;justify-content:space-around;text-align:center">
        <div><div class="hd" style="font-weight:700;font-size:20px">${own?S.myPosts.filter(id=>!POSTS[id].deleted).length:Object.values(POSTS).filter(p=>p.author===u.id).length}</div><div class="hint">Posts</div></div>
        <button data-a="openFollow" data-id="${u.id}" data-v="Followers" style="min-height:44px"><div class="hd" style="font-weight:700;font-size:20px">${short(u.followers+(own?0:(f?1:0)))}</div><div class="hint">Followers</div></button>
        <button data-a="openFollow" data-id="${u.id}" data-v="Following" style="min-height:44px"><div class="hd" style="font-weight:700;font-size:20px">${own?S.following.size:short(u.following)}</div><div class="hint">Following</div></button>
      </div></div>
    <div style="position:relative;margin-top:14px"><div class="row" style="gap:6px"><span class="hd" style="font-weight:700;font-size:24px">${esc(u.name)}</span>${vb(u,18)}</div>
    <div class="hint" style="font-size:14px">@${esc(u.username)}</div>
    <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">${vtag}${statusTag(u)}${!own&&u.followsMe?'<span class="tag grey">Follows you</span>':''}${!own&&u.followsMe&&f?'<span class="tag grey">Mutual</span>':''}</div>
    ${u.bio?`<p style="margin:12px 0 0;font-size:15px;line-height:1.45">${esc(u.bio)}</p>`:''}
    <div class="stack" style="gap:6px;margin-top:12px;font-size:13px;color:#D3D8D4">${meta.map(([i,t,hid])=>`<div class="row" style="gap:8px"><span style="color:#C8F169">${i}</span>${t}${hid?`<span class="hint row" style="gap:3px">${I('lock',12)}Only you</span>`:''}</div>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:16px">${own?`<button class="btn light sm" style="flex:1;height:42px" data-a="go" data-s="editProfile">Edit profile</button><button class="btn dark sm" style="flex:1;height:42px" data-a="go" data-s="${verified()?'service':'verification'}">${verified()?'Service info':'Get verified'}</button>`
      :`<button class="btn ${f?'dark':'lime'} sm" style="flex:1;height:42px" data-a="follow" data-id="${u.id}">${f?I('check',16)+'Following':'Follow'}</button><button class="btn dark sm" style="height:42px" data-a="share" data-kind="profile" data-id="${u.id}" aria-label="Share profile">${I('share',16)}</button>`}</div>
    </div></div></div>`;
}
SC.profile=()=>{
  const tab=S.profileTab,u=S.me;let body='';
  if(tab==='Posts'){const ps=S.myPosts.map(id=>POSTS[id]).filter(p=>!p.deleted);const rp=Object.values(POSTS).filter(p=>p.reposted&&!p.deleted);
    body=ps.length||rp.length?ps.map(p=>postCard(p)).join('')+(rp.length?`<div class="sec">Reposts</div>`+rp.map(p=>postCard(p)).join(''):''):empty('No posts yet','Share your first camp moment.',`<button class="btn sm lime" data-a="create">Create a post</button>`);}
  if(tab==='Journey') body=journey(u,true);
  if(tab==='Saved'){const sp=Object.values(POSTS).filter(p=>p.saved&&!p.deleted),sl=Object.values(LISTINGS).filter(l=>l.saved&&!l.deleted),se=Object.values(EVENTS).filter(e=>e.rsvp&&!e.deleted);
    body=sp.length||sl.length||se.length?`${sl.length?'<div class="sec">Listings</div>'+sl.map(listingCard).join(''):''}${se.length?'<div class="sec">Events you’re attending</div>'+se.map(eventCard).join(''):''}${sp.length?'<div class="sec">Posts</div>'+sp.map(p=>postCard(p)).join(''):''}`:empty('Nothing saved yet','Tap the bookmark on posts and listings to keep them here. Only you can see this.');}
  if(tab==='Listings'){const ml=S.myListings.map(id=>LISTINGS[id]).filter(l=>!l.deleted),me=S.myEvents.map(id=>EVENTS[id]).filter(e=>!e.deleted);
    body=ml.length||me.length?`${ml.length?'<div class="sec">Your listings</div>'+ml.map(listingCard).join(''):''}${me.length?'<div class="sec">Your events</div>'+me.map(eventCard).join(''):''}`:empty('No listings or events','Sell an item, hand over your apartment or organise a meetup.',`<button class="btn sm lime" data-a="create">Create</button>`);}
  return `<div class="scroll"><div class="topbar"><h1>Profile</h1><button class="ib" data-a="share" data-kind="profile" data-id="me" aria-label="Share profile">${I('share')}</button><button class="ib" data-a="go" data-s="settings" aria-label="Settings">${I('gear')}</button></div>
  ${profileHeader(u,true)}
  <div style="height:12px"></div>${chips(['Posts','Journey','Saved','Listings'],tab,'profileTab')}
  <div class="pad stack">${body}</div></div>${nav('profile')}`;
};
SC.user=t=>{const u=USERS[t.id];
  if(S.blocked.has(u.id)) return `${tb('@'+esc(u.username))}<div class="scroll nonav">${empty('You blocked '+esc(u.name),'You won’t see each other’s posts or be able to interact.',`<button class="btn sm dark" data-a="unblock" data-id="${u.id}">Unblock</button>`)}</div>`;
  const tab=S.userTab[u.id]||'Posts';let body='';
  if(tab==='Posts'){const ps=Object.values(POSTS).filter(p=>p.author===u.id&&!p.deleted);const ls=Object.values(LISTINGS).filter(l=>l.owner===u.id&&!l.deleted);
    body=(ps.length?ps.map(p=>postCard(p)).join(''):'')+(ls.length?'<div class="sec">Listings</div>'+ls.map(listingCard).join(''):'')||empty('No posts yet','');}
  if(tab==='Journey') body=journey(u,false);
  if(tab==='Communities'){const cs=Object.values(COMM).filter(c=>c.mods.includes(u.id)||(c.official&&(c.sub===u.batch||c.name.includes(u.state))));body=cs.length?cs.map(c=>commRow(c)).join(''):empty('No public communities','');}
  return `<div class="scroll">${tb('@'+esc(u.username),{right:`<button class="ib" data-a="userMenu" data-id="${u.id}" aria-label="More options">${I('more')}</button>`})}
  ${S.muted.has(u.id)?`<div class="pad" style="margin-bottom:10px"><div class="card row" style="padding:10px 14px;font-size:13px">${I('mute',16)}<span style="flex:1">Muted. Their posts are hidden from your feed.</span><button class="btn sm dark" data-a="unmute" data-id="${u.id}">Unmute</button></div></div>`:''}
  ${profileHeader(u,false)}<div style="height:12px"></div>
  <div class="chips">${['Posts','Journey','Communities'].map(x=>`<button class="chip ${x===tab?'on':''}" data-a="userTab" data-id="${u.id}" data-v="${x}" aria-pressed="${x===tab}">${x}</button>`).join('')}</div>
  <div class="pad stack">${body}</div></div>`;
};
SC.followList=t=>{const id=t.id,own=id==='me',u=user(id),tab=S.followTab;
  const others=Object.values(USERS).filter(x=>x.id!==id);
  const list=tab==='Followers'?(own?others.filter(x=>x.followsMe):others.slice(0,4)):(own?others.filter(x=>S.following.has(x.id)):others.slice(3,7));
  const total=tab==='Followers'?u.followers:(own?S.following.size:u.following);
  return `${tb(own?'Your connections':esc(u.name))}<div class="scroll nonav"><div class="pad stack">${seg(['Followers','Following'],tab,'followTab')}
  ${own?`<div class="hint" style="padding:0 4px">When you and someone follow each other, it shows as Mutual.</div>`:''}
  ${list.length?list.map(userRow).join(''):empty(tab==='Following'?'Not following anyone yet':'No followers yet','')}
  ${total>list.length&&list.length?`<div class="hint" style="text-align:center;padding:8px">+ ${(total-list.length).toLocaleString()} more</div>`:''}</div></div>`;};

// ===== Notifications =====
SC.notifications=()=>{const tab=S.notifTab;
  const list=NOTIF.filter(n=>tab==='All'||(tab==='Social'&&n.cat==='social')||(tab==='Communities'&&n.cat==='community'));
  return `${tb('Notifications',{right:`<button class="btn sm dark" data-a="readAll">Mark all read</button>`})}<div class="scroll nonav">
  ${chips(['All','Social','Communities'],tab,'notifTab')}
  <div class="pad stack">${list.length?`<div class="list">${list.map(n=>`<button class="li" data-a="openNotif" data-id="${n.id}" style="${n.read?'':'background:#202725'}">
    ${n.u?av(user(n.u),42):`<span class="ico" style="width:42px;height:42px;border-radius:14px;background:${n.cat==='service'?'#FF8A3D':'#2F3633'};color:${n.cat==='service'?'#0F1211':'#F2F4EF'}">${I(n.cat==='service'?'megaphone':'users',18)}</span>`}
    <span class="t"><span style="color:#F2F4EF;font-size:14px;line-height:1.4;margin:0">${n.cat==='service'?'<span class="tag oranges" style="padding:1px 6px;font-size:10px;margin-right:4px">Service</span>':''}${n.text}</span><span>${n.time}</span></span>
    ${n.read?'':'<span style="width:10px;height:10px;border-radius:5px;background:#C8F169;flex:none"><span class="vh">Unread</span></span>'}</button>`).join('')}</div>`:empty('You’re all caught up','')}
  <button class="btn dark block" data-a="go" data-s="notifSettings">${I('gear',18)}Notification settings</button></div></div>`;};

// ===== Settings =====
SC.settings=()=>{const vlabel={verified:'Verified',pending:'In review',rejected:'Action needed',unverified:'Not verified'}[S.verif];
  return `${tb('Settings')}<div class="scroll nonav"><div class="pad stack">
  <button class="card row" data-a="go" data-s="editProfile" style="width:100%;text-align:left">${av(S.me,56)}<span style="flex:1;min-width:0"><b class="hd" style="display:flex;gap:5px;align-items:center;font-size:18px">${esc(S.me.name)}${vb(S.me)}</b><span class="hint">@${esc(S.me.username)} · Edit profile</span></span>${chev}</button>
  <div class="sec">Account</div><div class="list">
    ${li({icon:'mail',title:'Account & security',sub:'Email, phone, password, sign-in',a:'go',data:'data-s="account"',right:chev})}
    ${li({icon:'shieldCheck',title:'Verification',sub:'Confirms you’re a corps member',a:'go',data:'data-s="verification"',right:`<span class="tag ${S.verif==='verified'?'lime':S.verif==='unverified'?'grey':'oranges'}">${vlabel}</span>`})}</div>
  <div class="sec">NYSC</div><div class="list">
    ${li({icon:'award',title:'Service information',sub:`${esc(S.me.batch)} · ${esc(S.me.state)} · ${esc(S.me.status)}`,a:'go',data:'data-s="service"',right:chev})}
    ${li({icon:'swap',title:'Redeployment',sub:S.me.redeploy?'Request under review':'Changing state? Keep your account',a:'go',data:'data-s="redeploy"',right:chev})}</div>
  <div class="sec">Preferences</div><div class="list">
    ${li({icon:'eye',title:'Privacy & visibility',sub:'Who sees your service details',a:'go',data:'data-s="privacy"',right:chev})}
    ${li({icon:'bell',title:'Notifications',sub:S.settings.push?'Push on'+(S.settings.quiet?' · quiet hours set':''):'Push off',a:'go',data:'data-s="notifSettings"',right:chev})}
    ${li({icon:'wifi',title:'Data & media',sub:S.settings.dataSaver?'Data saver on':'Data saver off',a:'go',data:'data-s="dataSettings"',right:chev})}</div>
  <div class="sec">Safety</div><div class="list">
    ${li({icon:'ban',title:'Blocked & muted',sub:`${S.blocked.size} blocked · ${S.muted.size} muted`,a:'go',data:'data-s="blocked"',right:chev})}
    ${li({icon:'shield',title:'Safety tips',sub:'Accommodation, marketplace, meetups',a:'go',data:'data-s="safety"',right:chev})}
    ${li({icon:'book',title:'Community guidelines',a:'go',data:'data-s="safety" data-t="guidelines"',right:chev})}</div>
  <div class="sec">Your data</div><div class="list">
    ${li({icon:'download',title:'Download my data',sub:'Get a copy of your posts and profile',a:'downloadData'})}
    ${li({icon:'moon',title:'Deactivate account',sub:'Hide your profile until you sign back in',a:'deactivateAsk'})}
    ${li({icon:'trash',title:'Delete account',sub:'Permanently remove your account',a:'deleteAsk',danger:true})}</div>
  <button class="btn dark block" data-a="logout">${I('logout',18)}Log out</button>
  <div class="hint" style="text-align:center;padding:8px 0 16px">Corper Connect prototype · sample data only, nothing is saved or sent<br>Not affiliated with or endorsed by NYSC</div>
  </div></div>`;};

INIT.editProfile=()=>{S.draft={name:S.me.name,username:S.me.username,bio:S.me.bio,photo:S.me.photo,interests:[...S.me.interests]};};
SC.editProfile=()=>{const d=S.draft;const pv={photo:d.photo,initials:initials(d.name||'?'),color:S.me.color};
  return `${tb('Edit profile',{close:true,right:`<button class="btn sm lime" data-a="saveProfile">Save</button>`})}<div class="scroll nonav"><div class="pad stack" style="gap:16px">
  <div class="row" style="gap:16px"><label for="pf2" style="cursor:pointer">${av(pv,84)}</label><div class="stack" style="gap:6px"><label for="pf2" class="btn sm dark" style="cursor:pointer">${I('camera',16)}Change photo</label>${d.photo?'<button class="btn sm" style="color:#FFA27F" data-a="rmDraftPhoto">Remove photo</button>':''}</div><input type="file" id="pf2" accept="image/*" class="vh" data-file="draftPhoto"></div>
  ${fld('name','Full name')}${fld('username','Username',{prefix:'@',prefixW:32,attrs:'autocapitalize="off"'})}${fld('bio','Bio',{area:true,attrs:'maxlength="160"',hint:'Up to 160 characters.'})}
  <div class="field"><span class="flabel">Interests</span><div style="display:flex;flex-wrap:wrap;gap:8px">${INTERESTS.map(x=>{const on=d.interests.includes(x);return `<button class="chip ${on?'on':''}" aria-pressed="${on}" data-a="toggleInterest" data-v="${x}">${x}</button>`;}).join('')}</div></div>
  <div class="hint">NYSC details like batch and state are changed from Service information so they can be reviewed.</div></div></div>`;};

INIT.account=()=>{S.draft={email:S.me.email,phone:S.me.phone,cur:'',np:'',np2:''};};
SC.account=()=>`${tb('Account & security')}<div class="scroll nonav"><div class="pad stack" style="gap:16px">
  <div class="sec">Contact for recovery</div>${fld('email','Email',{type:'email'})}${fld('phone','Phone',{type:'tel',prefix:'+234',prefixW:62,ph:'803 000 0000',opt:true})}
  <button class="btn dark block" data-a="saveContact">Save contact details</button>
  <div class="sec">Change password</div>${fld('cur','Current password',{type:'password'})}${fld('np','New password',{type:'password',hint:'At least 8 characters.'})}${fld('np2','Confirm new password',{type:'password'})}
  <button class="btn dark block" data-a="changePassword">Update password</button>
  <div class="sec">Sign-in methods</div><div class="list">${li({icon:'mail',title:'Email and password',sub:esc(S.me.email),right:'<span class="tag lime">On</span>'})}<div class="li"><span class="ico"><span style="font-weight:700">G</span></span><span class="t"><b>Google</b><span>${S.settings.google?'Connected':'Not connected'}</span></span>${sw(S.settings.google,'google','Google sign-in')}</div></div>
  <div class="hint">Security emails (new sign-ins, password changes) are always sent.</div></div></div>`;

SC.verification=()=>{const v=S.verif;
  const m={unverified:['shield','#2F3633','#F2F4EF','Not verified yet','Submit your call-up number and a document to unlock official communities, listings and events.'],pending:['clock','#FF8A3D','#0F1211','In review','We received your details. Reviews usually take up to 48 hours. We’ll email you and send a notification.'],verified:['shieldCheck','#C8F169','#0F1211','You’re verified','Your NYSC membership is confirmed. You have full corps-member access.'],rejected:['info','#FF8A3D','#0F1211','We couldn’t verify you','Reason: the call-up letter photo was too blurry to read. Upload a clearer copy and resubmit, or appeal if you think this is wrong.']}[v];
  const stp=[['Submitted',v!=='unverified'],['Under review',v==='pending'||v==='verified'||v==='rejected'],['Decision',v==='verified'||v==='rejected']];
  const access=[['Browse and follow',true],['Post in public feeds',true],['Join official communities',v==='verified'],['Create communities',v==='verified'],['Marketplace and accommodation listings',v==='verified'],['Create events',v==='verified']];
  return `${tb('Verification')}<div class="scroll nonav"><div class="pad stack">
  <div class="card" style="padding:20px"><span class="av" style="width:60px;height:60px;border-radius:20px;background:${m[1]};color:${m[2]}">${I(m[0],28)}</span><h2 class="hd" style="font-size:26px;margin:14px 0 6px">${m[3]}</h2><p style="margin:0;color:#D3D8D4;line-height:1.5;font-size:14px">${m[4]}</p>
    ${v==='unverified'?`<button class="btn lime block" style="margin-top:16px" data-a="go" data-s="verify" data-t="settings">Start verification</button>`:''}
    ${v==='rejected'?`<div class="row" style="gap:8px;margin-top:16px"><button class="btn lime" style="flex:1" data-a="go" data-s="verify" data-t="settings">Resubmit</button><button class="btn dark" style="flex:1" data-a="appeal">Appeal</button></div>`:''}</div>
  ${v!=='unverified'?`<div class="card"><div class="row" style="gap:0">${stp.map(([t,on],i)=>`<div style="flex:1;text-align:center"><div style="height:4px;border-radius:2px;background:${on?(v==='rejected'&&i===2?'#FF8A3D':'#C8F169'):'#2F3633'};margin-bottom:8px"></div><span style="font-size:12px;font-weight:600;color:${on?'#F2F4EF':'#7D8681'}">${t}</span></div>`).join('<span style="width:6px"></span>')}</div></div>`:''}
  <div class="sec">What verification unlocks</div><div class="list">${access.map(([t,on])=>`<div class="li"><span class="ico" style="${on?'background:#C8F169;color:#0F1211':''}">${I(on?'check':'lock',16)}</span><span class="t"><b style="font-weight:500">${t}</b></span></div>`).join('')}</div>
  <div class="hint" style="padding:0 4px">Verification confirms membership, not the truth of every post or the legitimacy of every listing.</div>
  <div class="card" style="border:1px dashed #4A5450;background:transparent"><div class="row" style="gap:8px;font-weight:700;font-size:14px">${I('info',16,'style="color:#C8F169"')}Prototype controls</div><div class="hint" style="margin:4px 0 10px">Simulate the review team’s decision to see each state.</div>
  <div class="grid2"><button class="btn sm lime" data-a="verifDemo" data-v="verified">Approve</button><button class="btn sm dark" data-a="verifDemo" data-v="rejected">Reject</button><button class="btn sm dark" data-a="verifDemo" data-v="pending">Set pending</button><button class="btn sm dark" data-a="verifDemo" data-v="unverified">Reset</button></div></div>
  </div></div>`;};

SC.service=()=>{const m=S.me;
  return `${tb('Service information')}<div class="scroll nonav"><div class="pad stack">
  <div class="list">${[['Status',m.status],['Batch',m.batch],['Stream',m.stream],['Orientation camp',m.status==='Awaiting deployment'?'—':m.camp],['State of deployment',m.state],['LGA',m.lga||'Not added'],['PPA',(m.ppa||'Not added')+' · private']].map(([a,b])=>`<div class="li"><span class="t"><span style="margin:0">${a}</span><b>${esc(b)}</b></span>${a==='PPA'?I('lock',16,'style="color:#A3ABA5"'):''}</div>`).join('')}</div>
  <button class="btn dark block" data-a="go" data-s="journey" data-t="edit">${I('edit',18)}Correct my details</button>
  ${m.redeploy?`<div class="card" style="border:1px solid #FF8A3D;background:transparent"><b>Redeployment to ${esc(m.redeploy.state)} in review</b><div class="hint" style="margin:4px 0 10px">Reason: ${esc(m.redeploy.reason)}. Your original batch and camp stay on your profile.</div><button class="btn sm lime" data-a="redeployApprove">Prototype: approve</button></div>`:`<button class="btn dark block" data-a="go" data-s="redeploy">${I('swap',18)}Request redeployment</button>`}
  ${m.history.length?`<div class="sec">History</div><div class="list">${m.history.map(h=>li({icon:'swap',title:`${esc(h.from)} → ${esc(h.to)}`,sub:'Redeployed · '+esc(h.when)})).join('')}</div>`:''}
  ${m.status!=='Completed'?(m.alumniReq?`<div class="card" style="border:1px solid #FF8A3D;background:transparent"><b>Passing-out confirmation in review</b><div class="hint" style="margin:4px 0 10px">Once confirmed, your status changes to Alumni. Your account, posts and connections stay.</div><button class="btn sm lime" data-a="alumniApprove">Prototype: confirm</button></div>`:`<button class="btn outline block" data-a="alumniAsk">${I('award',18)}I’ve completed my service</button>`):`<div class="card row">${I('award',22,'style="color:#B9CEFF"')}<span><b>Alumni</b><span class="hint" style="display:block">You’ve completed national service. Welcome to the alumni side.</span></span></div>`}
  </div></div>`;};

INIT.redeploy=()=>{S.draft={state:'Lagos',lga:'',reason:'Health',docName:''};};
SC.redeploy=()=>`${tb('Redeployment')}<div class="scroll" style="padding-bottom:100px"><div class="pad stack" style="gap:16px">
  <div class="card row" style="align-items:flex-start">${I('info',20,'style="color:#C8F169;margin-top:2px"')}<span style="font-size:14px;line-height:1.5;color:#D3D8D4">Don’t create a new account. Your posts, followers and communities stay. Your original batch and camp stay in your history.</span></div>
  <div class="card row" style="padding:12px 14px"><span class="hint">Currently</span><b style="margin-left:auto">${esc(S.me.state)}</b></div>
  ${fld('state','New state',{opts:STATES.filter(s=>s!==S.me.state)})}${fld('lga','New LGA',{opt:true,ph:'If you know it'})}
  ${fld('reason','Reason',{opts:['Health','Marriage','Security','Other approved reason']})}
  <div class="field"><span class="flabel">Redeployment letter</span><label for="rdoc" class="card" style="cursor:pointer;display:flex;gap:12px;align-items:center;border:1.5px dashed ${S.errors.doc?'#FF8A3D':'#4A5450'};background:transparent"><span style="color:${S.draft.docName?'#C8F169':'#A3ABA5'}">${I(S.draft.docName?'check':'file',22)}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${S.draft.docName?esc(S.draft.docName):'Upload approval letter'}</b><span class="hint">Only the verification team sees it</span></span></label><input id="rdoc" type="file" accept="image/*,.pdf" class="vh" data-file="redeployDoc">${S.errors.doc?`<span class="err">${S.errors.doc}</span>`:''}</div>
  <button class="btn dark block" data-a="exPlace" data-v="${esc(S.draft.state)}">${I('compass',18)}Explore ${esc(S.draft.state)} first</button>
  </div></div><div class="bottombar"><button class="btn lime block" data-a="redeploySubmit">Submit for review</button></div>`;

SC.privacy=()=>{const s=S.settings;const row=(k,t,sub)=>`<div class="li"><span class="t"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</span>${sw(s[k],k,t)}</div>`;
  return `${tb('Privacy & visibility')}<div class="scroll nonav"><div class="pad stack">
  <div class="field"><span class="flabel">Who can see your profile</span>${seg(['Everyone','Corps members','Followers'],s.vis,'setSetting','data-k="vis"')}<span class="hint">${s.vis==='Everyone'?'Anyone using the app, including unverified accounts.':s.vis==='Corps members'?'Only verified corps members and alumni.':'Only people who follow you.'}</span></div>
  <div class="sec">Service details on your profile</div><div class="list">${row('showBatch','Batch and camp','Helps campmates find you')}${row('showState','Current state')}${row('showLga','LGA')}${row('showPpa','PPA','Off by default. We recommend keeping it private.')}</div>
  <div class="sec">Activity</div><div class="list">${row('showLists','Followers and following lists')}${row('showLoc','Location on posts','Only a general place name, never precise location')}</div>
  <div class="card"><div class="hd" style="font-weight:700;font-size:16px;margin-bottom:8px">Others see</div><div class="stack" style="gap:6px;font-size:14px">${[['Batch & camp',s.showBatch],['State',s.showState],['LGA',s.showLga],['PPA',s.showPpa],['Follower lists',s.showLists]].map(([a,on])=>`<div class="row" style="justify-content:space-between"><span class="muted">${a}</span><span style="color:${on?'#C8F169':'#A3ABA5'};display:flex;align-items:center;gap:4px">${I(on?'eye':'lock',14)}${on?'Visible':'Hidden'}</span></div>`).join('')}</div></div>
  </div></div>`;};

SC.notifSettings=()=>{const s=S.settings;const row=(k,t,sub)=>`<div class="li" style="${!s.push&&k!=='push'&&k!=='emailProduct'?'opacity:.45':''}"><span class="t"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</span>${sw(s[k],k,t)}</div>`;
  const muted=[...S.mutedComms].map(id=>COMM[id]);
  return `${tb('Notifications')}<div class="scroll nonav"><div class="pad stack">
  <div class="list">${row('push','Push notifications','On this device')}</div>
  <div class="sec">Social</div><div class="list">${row('nFollows','New followers')}${row('nLikes','Likes and reposts','Grouped, never one per like')}${row('nComments','Comments')}${row('nMentions','Mentions')}</div>
  <div class="sec">Communities & service</div><div class="list">${row('nComm','Community announcements and pinned posts')}${row('nService','Camp and state updates','From official communities')}${row('nEvents','Event changes and reminders')}</div>
  <div class="sec">Quiet hours</div><div class="list">${row('quiet','Pause push at night','Security notices still come through')}
    ${s.quiet?`<div class="li"><span class="t"><b>From</b></span><label class="vh" for="qf">From</label><input id="qf" type="time" class="inp" data-c="qFrom" value="${s.qFrom}" style="width:130px;height:42px"></div><div class="li"><span class="t"><b>To</b></span><label class="vh" for="qt">To</label><input id="qt" type="time" class="inp" data-c="qTo" value="${s.qTo}" style="width:130px;height:42px"></div>`:''}</div>
  <div class="sec">Email</div><div class="list"><div class="li"><span class="t"><b>Account and security</b><span>Verification, sign-ins and important notices</span></span><span class="tag lime">Always on</span></div>${row('emailProduct','Product news and tips')}</div>
  <div class="sec">Muted communities</div>${muted.length?`<div class="list">${muted.map(c=>`<div class="li">${cav(c,36)}<span class="t"><b>${esc(c.name)}</b></span><button class="btn sm dark" data-a="muteComm" data-id="${c.id}">Unmute</button></div>`).join('')}</div>`:'<div class="hint" style="padding:0 4px">None. Mute a community from its ••• menu.</div>'}
  </div></div>`;};

SC.dataSettings=()=>{const s=S.settings;
  return `${tb('Data & media')}<div class="scroll nonav"><div class="pad stack">
  <div class="list"><div class="li"><span class="t"><b>Data saver</b><span>Photos load only when you tap them</span></span>${sw(s.dataSaver,'dataSaver','Data saver')}</div><div class="li"><span class="t"><b>Autoplay videos</b><span>Off saves data. Videos never autoplay in high resolution.</span></span>${sw(s.autoplay,'autoplay','Autoplay videos')}</div></div>
  <div class="field"><span class="flabel">Upload quality</span>${seg(['Standard','High'],s.quality,'setSetting','data-k="quality"')}<span class="hint">Standard uploads faster and uses less data.</span></div>
  <div class="list">${li({icon:'trash',title:'Clear cached media',sub:'Frees up space on your phone',a:'clearCache'})}</div></div></div>`;};

SC.blocked=()=>{const t=S.blockTab||'Blocked';const ids=[...(t==='Blocked'?S.blocked:S.muted)];
  return `${tb('Blocked & muted')}<div class="scroll nonav"><div class="pad stack">${seg(['Blocked','Muted'],t,'blockTab')}
  <div class="hint" style="padding:0 4px">${t==='Blocked'?'Blocked people can’t see your posts or interact with you, and you won’t see theirs.':'Muted people aren’t told. Their posts are just hidden from your feed.'}</div>
  ${ids.length?`<div class="list">${ids.map(id=>{const u=USERS[id];return `<div class="li">${av(u,40)}<span class="t"><b>${esc(u.name)}</b><span>@${esc(u.username)}</span></span><button class="btn sm dark" data-a="${t==='Blocked'?'unblock':'unmute'}" data-id="${id}">${t==='Blocked'?'Unblock':'Unmute'}</button></div>`;}).join('')}</div>`:empty(t==='Blocked'?'No one blocked':'No one muted','You can block or mute from any post or profile’s ••• menu.')}</div></div>`;};

SC.safety=t=>{const g=t.t==='guidelines';
  const tips=[['building','Accommodation',['Always inspect in person before paying anything.','Confirm the person can legally rent or hand over the place.','Get rent and every fee in writing.','Report listings that pressure you to pay quickly.']],['bag','Marketplace',['Meet in public, busy places.','Check items before paying.','Be careful with payment in advance.']],['cal','Meetups & events',['Tell a friend where you’re going.','Meet in public venues.','Leave if something feels off.']],['lock','Personal information',['Keep your PPA private unless you trust someone.','Never share your call-up number or documents in posts.','No one from the platform will ask for your password.']]];
  const rules=['Treat every corps member with respect. No harassment or bullying.','Don’t pretend to be NYSC, the platform or another person.','Only authorised accounts post official announcements. Label rumours as rumours.','No scams, fake listings or misleading prices.','No hate speech, threats or sexual content.','Report problems instead of escalating them.'];
  return `${tb(g?'Community guidelines':'Safety tips')}<div class="scroll nonav"><div class="pad stack">
  ${g?`<div class="card"><ol style="margin:0;padding-left:20px;line-height:1.65;color:#D3D8D4">${rules.map(r=>`<li style="margin-bottom:6px">${r}</li>`).join('')}</ol></div><div class="hint" style="padding:0 4px">Moderators are corps members who run communities. Serious issues go to the platform team. Significant decisions can be appealed.</div>`
  :tips.map(([i,t,l])=>`<div class="card"><div class="row" style="gap:10px"><span class="ico" style="width:40px;height:40px;border-radius:14px;background:#C8F169;color:#0F1211;display:flex;align-items:center;justify-content:center">${I(i,20)}</span><b class="hd" style="font-size:18px">${t}</b></div><ul style="margin:10px 0 0;padding-left:18px;line-height:1.6;color:#D3D8D4;font-size:14px">${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}
  </div></div>`;};
// ---------- Bottom sheets ----------
const SH={};
SH.create=s=>{const lock=!verified();
  const tile=(t,ic,l,sub)=>`<button class="card" data-a="compose" data-t="${t}" style="background:#232927;text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:104px"><span class="av" style="width:40px;height:40px;border-radius:14px;background:#C8F169">${I(ic,20)}</span><span><b style="display:block;font-size:15px">${l}</b><span class="hint">${sub}</span></span></button>`;
  const row=(t,ic,l,sub)=>`<button class="li" data-a="compose" data-t="${t}"><span class="ico" style="background:#FF8A3D;color:#0F1211">${I(ic,18)}</span><span class="t"><b>${l}</b><span>${sub}</span></span>${lock?`<span class="tag grey">${I('lock',11)}Verified</span>`:chev}</button>`;
  return `<h2>What would you like to share?</h2>${s.comm?`<div class="hint" style="margin-bottom:6px">Posting in ${esc(COMM[s.comm].name)}</div>`:''}

const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtTime=t=>{if(!t)return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`;};
const fmtDate=d=>{const dt=new Date(d+'T12:00');return {day:String(dt.getDate()),mon:MONS[dt.getMonth()],date:`${DAYS[dt.getDay()]}, ${dt.getDate()} ${MONS[dt.getMonth()][0]+MONS[dt.getMonth()].slice(1).toLowerCase()}`};};

  noop(){}, back(){back();}, closeSheet(){closeSheet();},

  // onboarding

    if(S.draft.method==='Email'){ok=need('email','Enter a valid email address.',x=>EMAIL.test(x))&&ok;ok=need('password',si?'Enter your password.':'Use at least 8 characters.',x=>si?x.length>0:x.length>=8)&&ok;}
