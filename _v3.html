  <div class="row" style="gap:16px"><label for="pf2" style="cursor:pointer">${av(pv,84)}</label><div class="stack" style="gap:6px"><label for="pf2" class="btn sm dark" style="cursor:pointer">${I('camera',16)}Change photo</label>${d.photo?'<button class="btn sm" style="color:var(--err)" data-a="rmDraftPhoto">Remove photo</button>':''}</div><input type="file" id="pf2" accept="image/*" class="vh" data-file="draftPhoto"></div>
  ${fld('name','Full name')}${fld('username','Username',{prefix:'@',prefixW:32,attrs:'autocapitalize="off"'})}${fld('bio','Bio',{area:true,attrs:'maxlength="160"',hint:'Up to 160 characters.'})}
  <div class="field"><span class="flabel">Interests</span><div style="display:flex;flex-wrap:wrap;gap:8px">${INTERESTS.map(x=>{const on=d.interests.includes(x);return `<button class="chip ${on?'on':''}" aria-pressed="${on}" data-a="toggleInterest" data-v="${x}">${x}</button>`;}).join('')}</div></div>
  <div class="hint">NYSC details like batch and state are changed from Service information so they can be reviewed.</div></div></div>`;};

INIT.account=()=>{S.draft={email:S.me.email,phone:S.me.phone,cur:'',np:'',np2:''};};
SC.account=()=>`${tb('Account & security')}<div class="scroll nonav"><div class="pad stack" style="gap:16px">
  <div class="sec">Contact for recovery</div>${fld('email','Email',{type:'email'})}${fld('phone','Phone',{type:'tel',prefix:'+234',prefixW:62,ph:'803 000 0000',opt:true})}
  <button class="btn dark block" data-a="saveContact">Save contact details</button>
  <div class="sec">Change password</div>${fld('cur','Current password',{type:'password'})}${fld('np','New password',{type:'password',hint:'At least 8 characters.'})}${fld('np2','Confirm new password',{type:'password'})}
  <button class="btn dark block" data-a="changePassword">Update password</button>
  <div class="sec">Sign-in methods</div><div class="list">${li({icon:'mail',title:'Email and password',sub:esc(S.me.email),right:'<span class="tag lime">On</span>'})}<div class="li"><span class="ico"><span style="font-weight:700">G</span></span><span class="t"><b>Google</b><span>${S.settings.google?'Connected':'Not connected'}</span></span>${sw(S.settings.google,'google','Google sign-in')}</div></div>
  <div class="sec">Devices</div><div class="list">${li({icon:'phone',title:'Signed-in devices',sub:S.devices.length+(S.devices.length===1?' device':' devices'),a:'go',data:'data-s="sessions"',right:chev})}</div>
  <div class="hint">Security emails (new sign-ins, password changes) are always sent.</div></div></div>`;

SC.verification=()=>{const v=S.verif;
  const m={unverified:['shield','var(--line)','var(--text)','Not verified yet','Submit your call-up number and a document to unlock official communities, listings and events.'],pending:['clock','#FF8A3D','var(--ink)','In review','We received your details. Reviews usually take up to 48 hours. We’ll email you and send a notification.'],verified:['shieldCheck','#C8F169','var(--ink)','You’re verified','Your NYSC membership is confirmed. You have full corps-member access.'],rejected:['info','#FF8A3D','var(--ink)','We couldn’t verify you','Reason: the call-up letter photo was too blurry to read. Upload a clearer copy and resubmit, or appeal if you think this is wrong.']}[v];
  const stp=[['Submitted',v!=='unverified'],['Under review',v==='pending'||v==='verified'||v==='rejected'],['Decision',v==='verified'||v==='rejected']];
  const access=[['Browse and follow',true],['Post in public feeds',true],['Join official communities',v==='verified'],['Create communities',v==='verified'],['Jobs, marketplace and accommodation listings',v==='verified'],['Create events',v==='verified']];
  return `${tb('Verification')}<div class="scroll nonav"><div class="pad stack">
  <div class="card" style="padding:20px"><span class="av" style="width:60px;height:60px;border-radius:20px;background:${m[1]};color:${m[2]}">${I(m[0],28)}</span><h2 class="hd" style="font-size:26px;margin:14px 0 6px">${m[3]}</h2><p style="margin:0;color:var(--soft);line-height:1.5;font-size:14px">${m[4]}</p>
    ${v==='unverified'?`<button class="btn lime block" style="margin-top:16px" data-a="go" data-s="verify" data-t="settings">Start verification</button>`:''}
    ${v==='rejected'?`<div class="row" style="gap:8px;margin-top:16px"><button class="btn lime" style="flex:1" data-a="go" data-s="verify" data-t="settings">Resubmit</button><button class="btn dark" style="flex:1" data-a="appeal">Appeal</button></div>`:''}</div>
  ${v!=='unverified'?`<div class="card"><div class="row" style="gap:0">${stp.map(([t,on],i)=>`<div style="flex:1;text-align:center"><div style="height:4px;border-radius:2px;background:${on?(v==='rejected'&&i===2?'#FF8A3D':'#C8F169'):'var(--line)'};margin-bottom:8px"></div><span style="font-size:12px;font-weight:600;color:${on?'var(--text)':'var(--ph)'}">${t}</span></div>`).join('<span style="width:6px"></span>')}</div></div>`:''}
  <div class="sec">What verification unlocks</div><div class="list">${access.map(([t,on])=>`<div class="li"><span class="ico" style="${on?'background:#C8F169;color:var(--ink)':''}">${I(on?'check':'lock',16)}</span><span class="t"><b style="font-weight:500">${t}</b></span></div>`).join('')}</div>
  <div class="hint" style="padding:0 4px">Verification confirms membership, not the truth of every post or the legitimacy of every listing.</div>
  <div class="card" style="border:1px dashed var(--line3);background:transparent"><div class="row" style="gap:8px;font-weight:700;font-size:14px">${I('info',16,'style="color:var(--accent-text)"')}Prototype controls</div><div class="hint" style="margin:4px 0 10px">Simulate the review team’s decision to see each state.</div>
  <div class="grid2"><button class="btn sm lime" data-a="verifDemo" data-v="verified">Approve</button><button class="btn sm dark" data-a="verifDemo" data-v="rejected">Reject</button><button class="btn sm dark" data-a="verifDemo" data-v="pending">Set pending</button><button class="btn sm dark" data-a="verifDemo" data-v="unverified">Reset</button></div></div>
  </div></div>`;};

SC.service=()=>{const m=S.me;
  return `${tb('Service information')}<div class="scroll nonav"><div class="pad stack">
  <div class="list">${[['Status',m.status],['Batch',m.batch],['Stream',m.stream],['Orientation camp',m.status==='Awaiting deployment'?'—':m.camp],['State of deployment',m.state],['LGA',m.lga||'Not added'],['PPA',(m.ppa||'Not added')+' · private']].map(([a,b])=>`<div class="li"><span class="t"><span style="margin:0">${a}</span><b>${esc(b)}</b></span>${a==='PPA'?I('lock',16,'style="color:var(--muted)"'):''}</div>`).join('')}</div>
  <button class="btn dark block" data-a="go" data-s="journey" data-t="edit">${I('edit',18)}Correct my details</button>
  ${m.redeploy?`<div class="card" style="border:1px solid #FF8A3D;background:transparent"><b>Redeployment to ${esc(m.redeploy.state)} in review</b><div class="hint" style="margin:4px 0 10px">Reason: ${esc(m.redeploy.reason)}. Your original batch and camp stay on your profile.</div><button class="btn sm lime" data-a="redeployApprove">Prototype: approve</button></div>`:`<button class="btn dark block" data-a="go" data-s="redeploy">${I('swap',18)}Request redeployment</button>`}
  ${m.history.length?`<div class="sec">History</div><div class="list">${m.history.map(h=>li({icon:'swap',title:`${esc(h.from)} → ${esc(h.to)}`,sub:'Redeployed · '+esc(h.when)})).join('')}</div>`:''}
  ${m.status!=='Completed'?(m.alumniReq?`<div class="card" style="border:1px solid #FF8A3D;background:transparent"><b>Passing-out confirmation in review</b><div class="hint" style="margin:4px 0 10px">Once confirmed, your status changes to Alumni. Your account, posts and connections stay.</div><button class="btn sm lime" data-a="alumniApprove">Prototype: confirm</button></div>`:`<button class="btn outline block" data-a="alumniAsk">${I('award',18)}I’ve completed my service</button>`):`<div class="card row">${I('award',22,'style="color:var(--blue-text)"')}<span><b>Alumni</b><span class="hint" style="display:block">You’ve completed national service. Welcome to the alumni side.</span></span></div>`}
  </div></div>`;};

INIT.redeploy=()=>{S.draft={state:'Lagos',lga:'',reason:'Health',docName:''};};
SC.redeploy=()=>`${tb('Redeployment')}<div class="scroll" style="padding-bottom:100px"><div class="pad stack" style="gap:16px">
  <div class="card row" style="align-items:flex-start">${I('info',20,'style="color:var(--accent-text);margin-top:2px"')}<span style="font-size:14px;line-height:1.5;color:var(--soft)">Don’t create a new account. Your posts, followers and communities stay. Your original batch and camp stay in your history.</span></div>
  <div class="card row" style="padding:12px 14px"><span class="hint">Currently</span><b style="margin-left:auto">${esc(S.me.state)}</b></div>
  ${fld('state','New state',{opts:STATES.filter(s=>s!==S.me.state)})}${fld('lga','New LGA',{opt:true,ph:'If you know it'})}
  ${fld('reason','Reason',{opts:['Health','Marriage','Security','Other approved reason']})}
  <div class="field"><span class="flabel">Redeployment letter</span><label for="rdoc" class="card" style="cursor:pointer;display:flex;gap:12px;align-items:center;border:1.5px dashed ${S.errors.doc?'#FF8A3D':'var(--line3)'};background:transparent"><span style="color:${S.draft.docName?'var(--accent-text)':'var(--muted)'}">${I(S.draft.docName?'check':'file',22)}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${S.draft.docName?esc(S.draft.docName):'Upload approval letter'}</b><span class="hint">Only the verification team sees it</span></span></label><input id="rdoc" type="file" accept="image/*,.pdf" class="vh" data-file="redeployDoc">${S.errors.doc?`<span class="err">${S.errors.doc}</span>`:''}</div>
  <button class="btn dark block" data-a="exPlace" data-v="${esc(S.draft.state)}">${I('compass',18)}Explore ${esc(S.draft.state)} first</button>
  </div></div><div class="bottombar"><button class="btn lime block" data-a="redeploySubmit">Submit for review</button></div>`;

SC.privacy=()=>{const s=S.settings;const row=(k,t,sub)=>`<div class="li"><span class="t"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</span>${sw(s[k],k,t)}</div>`;
  return `${tb('Privacy & visibility')}<div class="scroll nonav"><div class="pad stack">
  <div class="field"><span class="flabel">Who can see your profile</span>${seg(['Everyone','Corps members','Followers'],s.vis,'setSetting','data-k="vis"')}<span class="hint">${s.vis==='Everyone'?'Anyone using the app, including unverified accounts.':s.vis==='Corps members'?'Only verified corps members and alumni.':'Only people who follow you.'}</span></div>
  <div class="sec">Service details on your profile</div><div class="list">${row('showBatch','Batch and camp','Helps campmates find you')}${row('showState','Current state')}${row('showLga','LGA')}${row('showPpa','PPA','Off by default. We recommend keeping it private.')}</div>
  <div class="sec">Activity</div><div class="list">${row('showLists','Followers and following lists')}${row('showLoc','Location on posts','Only a general place name, never precise location')}</div>
  <div class="card"><div class="hd" style="font-weight:700;font-size:16px;margin-bottom:8px">Others see</div><div class="stack" style="gap:6px;font-size:14px">${[['Batch & camp',s.showBatch],['State',s.showState],['LGA',s.showLga],['PPA',s.showPpa],['Follower lists',s.showLists]].map(([a,on])=>`<div class="row" style="justify-content:space-between"><span class="muted">${a}</span><span style="color:${on?'var(--accent-text)':'var(--muted)'};display:flex;align-items:center;gap:4px">${I(on?'eye':'lock',14)}${on?'Visible':'Hidden'}</span></div>`).join('')}</div></div>
  </div></div>`;};

SC.notifSettings=()=>{const s=S.settings;const row=(k,t,sub)=>`<div class="li" style="${!s.push&&k!=='push'&&k!=='emailProduct'?'opacity:.45':''}"><span class="t"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</span>${sw(s[k],k,t)}</div>`;
  const muted=[...S.mutedComms].map(id=>COMM[id]);
  return `${tb('Notifications')}<div class="scroll nonav"><div class="pad stack">
  <div class="list">${row('push','Push notifications','On this device')}</div>
  <div class="sec">Social</div><div class="list">${row('nFollows','New followers')}${row('nLikes','Likes and reposts','Grouped, never one per like')}${row('nComments','Comments')}${row('nMentions','Mentions')}</div>
  <div class="sec">Communities & service</div><div class="list">${row('nComm','Community announcements and pinned posts')}${row('nService','Camp and state updates','From official communities')}${row('nEvents','Event changes and reminders')}</div>
  <div class="sec">Quiet hours</div><div class="list">${row('quiet','Pause push at night','Security notices still come through')}
    ${s.quiet?`<div class="li"><span class="t"><b>From</b></span><label class="vh" for="qf">From</label><input id="qf" type="time" class="inp" data-c="qFrom" value="${s.qFrom}" style="width:130px;height:42px"></div><div class="li"><span class="t"><b>To</b></span><label class="vh" for="qt">To</label><input id="qt" type="time" class="inp" data-c="qTo" value="${s.qTo}" style="width:130px;height:42px"></div>`:''}</div>
  <div class="sec">Email</div><div class="list"><div class="li"><span class="t"><b>Account and security</b><span>Verification, sign-ins and important notices</span></span><span class="tag lime">Always on</span></div>${row('emailProduct','Product news and tips')}</div>
  <div class="sec">Muted communities</div>${muted.length?`<div class="list">${muted.map(c=>`<div class="li">${cav(c,36)}<span class="t"><b>${esc(c.name)}</b></span><button class="btn sm dark" data-a="muteComm" data-id="${c.id}">Unmute</button></div>`).join('')}</div>`:'<div class="hint" style="padding:0 4px">None. Mute a community from its ••• menu.</div>'}
  </div></div>`;};

SC.dataSettings=()=>{const s=S.settings;
  return `${tb('Data & media')}<div class="scroll nonav"><div class="pad stack">
  <div class="list"><div class="li"><span class="t"><b>Data saver</b><span>Photos load only when you tap them</span></span>${sw(s.dataSaver,'dataSaver','Data saver')}</div><div class="li"><span class="t"><b>Autoplay videos</b><span>Off saves data. Videos never autoplay in high resolution.</span></span>${sw(s.autoplay,'autoplay','Autoplay videos')}</div></div>
  <div class="field"><span class="flabel">Appearance</span><div class="seg" role="radiogroup" aria-label="Appearance">${['system','light','dark'].map(x=>`<button role="radio" aria-checked="${CCTheme.get()===x}" class="${CCTheme.get()===x?'on':''}" data-a="setTheme" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><span class="hint">System follows your phone or computer setting.</span></div>
  <div class="field"><span class="flabel">Upload quality</span>${seg(['Standard','High'],s.quality,'setSetting','data-k="quality"')}<span class="hint">Standard uploads faster and uses less data.</span></div>
  <div class="list"><div class="li"><span class="t"><b>Simulate offline</b><span>Demo of the no-connection state</span></span>${sw(s.offline,'offline','Simulate offline')}</div></div>
  <div class="list">${li({icon:'trash',title:'Clear cached media',sub:'Frees up space on your phone',a:'clearCache'})}</div></div></div>`;};

SC.blocked=()=>{const t=S.blockTab||'Blocked';const ids=[...(t==='Blocked'?S.blocked:S.muted)];
  return `${tb('Blocked & muted')}<div class="scroll nonav"><div class="pad stack">${seg(['Blocked','Muted'],t,'blockTab')}
  <div class="hint" style="padding:0 4px">${t==='Blocked'?'Blocked people can’t see your posts or interact with you, and you won’t see theirs.':'Muted people aren’t told. Their posts are just hidden from your feed.'}</div>
  ${ids.length?`<div class="list">${ids.map(id=>{const u=USERS[id];return `<div class="li">${av(u,40)}<span class="t"><b>${esc(u.name)}</b><span>@${esc(u.username)}</span></span><button class="btn sm dark" data-a="${t==='Blocked'?'unblock':'unmute'}" data-id="${id}">${t==='Blocked'?'Unblock':'Unmute'}</button></div>`;}).join('')}</div>`:empty(t==='Blocked'?'No one blocked':'No one muted','You can block or mute from any post or profile’s ••• menu.')}</div></div>`;};

SC.safety=t=>{const g=t.t==='guidelines';
  const tips=[['building','Accommodation',['Always inspect in person before paying anything.','Confirm the person can legally rent or hand over the place.','Get rent and every fee in writing.','Report listings that pressure you to pay quickly.']],['bag','Marketplace',['Meet in public, busy places.','Check items before paying.','Be careful with payment in advance.']],['briefcase','Jobs',['Never pay a fee to get a job or interview.','Check the employer is real before sharing documents.','Be wary of pay that sounds too good to be true.','Report listings that ask for money.']],['cal','Meetups & events',['Tell a friend where you’re going.','Meet in public venues.','Leave if something feels off.']],['lock','Personal information',['Keep your PPA private unless you trust someone.','Never share your call-up number or documents in posts.','No one from the platform will ask for your password.']]];
  const rules=['Treat every corps member with respect. No harassment or bullying.','Don’t pretend to be NYSC, the platform or another person.','Only authorised accounts post official announcements. Label rumours as rumours.','No scams, fake listings or misleading prices.','No hate speech, threats or sexual content.','Report problems instead of escalating them.'];
  return `${tb(g?'Community guidelines':'Safety tips')}<div class="scroll nonav"><div class="pad stack">
  ${g?`<div class="card"><ol style="margin:0;padding-left:20px;line-height:1.65;color:var(--soft)">${rules.map(r=>`<li style="margin-bottom:6px">${r}</li>`).join('')}</ol></div><div class="hint" style="padding:0 4px">Moderators are corps members who run communities. Serious issues go to the platform team. Significant decisions can be appealed.</div>`
  :tips.map(([i,t,l])=>`<div class="card"><div class="row" style="gap:10px"><span class="ico" style="width:40px;height:40px;border-radius:14px;background:#C8F169;color:var(--ink);display:flex;align-items:center;justify-content:center">${I(i,20)}</span><b class="hd" style="font-size:18px">${t}</b></div><ul style="margin:10px 0 0;padding-left:18px;line-height:1.6;color:var(--soft);font-size:14px">${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}
  </div></div>`;};
// ---------- Bottom sheets ----------
const SH={};
SH.appearance=()=>{const cur=CCTheme.get();const o=(v,t,sub)=>`<button class="opt ${cur===v?'on':''}" style="background:var(--raised);border-color:${cur===v?'var(--accent-border)':'var(--raised)'};padding:12px 14px" data-a="setTheme" data-v="${v}" data-close="1" role="radio" aria-checked="${cur===v}"><span class="radio"></span><span style="font-size:15px"><b style="display:block">${t}</b><span class="hint">${sub}</span></span></button>`;
  return `<h2>Appearance</h2><p class="hint" style="margin:0 0 12px">Choose how Corpers Connect looks on this device.</p><div class="stack" style="gap:8px" role="radiogroup" aria-label="Theme">${o('system','System (default)','Matches your phone or computer, light by day and dark by night if it does')}${o('light','Light','Bright background for daytime')}${o('dark','Dark','Dark background, easier on the eyes at night')}</div>`;};
SH.create=s=>{const lock=!verified();
  const tile=(t,ic,l,sub)=>`<button class="card" data-a="compose" data-t="${t}" style="background:var(--raised);text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:104px"><span class="av" style="width:40px;height:40px;border-radius:14px;background:#C8F169">${I(ic,20)}</span><span><b style="display:block;font-size:15px">${l}</b><span class="hint">${sub}</span></span></button>`;
  const row=(t,ic,l,sub)=>`<button class="li" data-a="compose" data-t="${t}"><span class="ico" style="background:#FF8A3D;color:var(--ink)">${I(ic,18)}</span><span class="t"><b>${l}</b><span>${sub}</span></span>${lock?`<span class="tag grey">${I('lock',11)}Verified</span>`:chev}</button>`;
  return `<h2>What would you like to share?</h2>${s.comm?`<div class="hint" style="margin-bottom:6px">Posting in ${esc(COMM[s.comm].name)}</div>`:''}
  <div class="sec" style="padding:10px 2px 8px">Share something</div><div class="grid2">${tile('photo','camera','Photo / video','Camp moments')}${tile('discussion','disc','Discussion','Start a conversation')}${tile('question','help','Question','Ask corpers')}${tile('poll','poll','Poll','Get a quick vote')}</div>
  ${s.comm?'':`<div class="sec" style="padding:16px 2px 8px">Opportunities and listings</div><div class="list">${row('job','briefcase','Share a job','Openings, gigs, internships')}${row('sell','bag','Sell an item','Mattress, fan, khaki…')}${row('accommodation','building','Accommodation','Rooms, handovers, roommates')}${row('event','cal','Create an event','Meetups, reunions, CDS outreach')}</div>`}`;};
SH.gate=s=>`<span class="av" style="width:56px;height:56px;border-radius:18px;background:#FF8A3D;margin-top:4px">${I('lock',26)}</span><h2 style="margin-top:14px">Verified members only</h2>
  <p style="color:var(--soft);line-height:1.5;margin:0 0 18px;font-size:14px">${esc(s.why||'This feature')} is available once your NYSC membership is verified. ${S.verif==='pending'?'Your verification is already in review.':'It takes a couple of minutes to submit.'}</p>
  <button class="btn lime block" data-a="go" data-s="verification">${S.verif==='pending'?'Check status':'Get verified'}</button><button class="btn block" style="color:var(--muted);margin-top:6px" data-a="closeSheet">Not now</button>`;
SH.postMenu=s=>{const p=POSTS[s.id],mine=p.author==='me',u=p.author?user(p.author):null,f=u&&S.following.has(u.id);
  return `<div class="list">${li({icon:'bookmark',title:p.saved?'Remove from saved':'Save post',a:'save',data:`data-id="${p.id}"`})}${li({icon:'link',title:'Copy link',a:'copyLink'})}
  ${mine&&p.type!=='poll'?li({icon:'edit',title:'Edit post',a:'editPost',data:`data-id="${p.id}"`}):''}
  ${mine?li({icon:'trash',title:'Delete post',danger:true,a:'deletePostAsk',data:`data-id="${p.id}"`})
  :`${li({icon:'user',title:(f?'Unfollow ':'Follow ')+esc(first(u)),a:'follow',data:`data-id="${u.id}"`})}${li({icon:'mute',title:'Mute '+esc(first(u)),sub:'Hide their posts. They won’t be told.',a:'mute',data:`data-id="${u.id}"`})}${li({icon:'ban',title:'Block '+esc(first(u)),sub:'You won’t be able to interact',a:'blockAsk',data:`data-id="${u.id}"`})}${p.community&&isMod(COMM[p.community])?li({icon:'pin',title:'Pin to community',sub:'Moderator action',a:'modPin',data:`data-id="${p.id}"`})+li({icon:'trash',title:'Remove as moderator',danger:true,a:'modRemove',data:`data-id="${p.id}"`}):''}${li({icon:'flag',title:'Report post',danger:true,a:'report',data:`data-kind="post" data-id="${p.id}"`})}`}</div>`;};
SH.userMenu=s=>{const u=USERS[s.id];

const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const fmtDate=d=>{const dt=new Date(d+'T12:00');return {day:String(dt.getDate()),mon:MONS[dt.getMonth()],date:`${DAYS[dt.getDay()]}, ${dt.getDate()} ${MONS[dt.getMonth()][0]+MONS[dt.getMonth()].slice(1).toLowerCase()}`};};

// ---- Moderator panel
function modPanel(c){
  const reps=Object.values(POSTS).filter(p=>p.community===c.id&&p.author&&!p.deleted&&p.author!=='me').slice(0,3);
  const open=reps.filter(p=>!S.modDone.has(c.id+':'+p.id));
  const mem=['ahmed','segun','halima','david'].filter(id=>!S.removedMembers.has(c.id+':'+id));
  return `<div class="card" style="border:1px solid var(--accent-border);background:transparent"><div class="row" style="gap:8px">${I('shield',18,'style="color:var(--accent-text)"')}<b>Moderator tools</b></div><div class="hint" style="margin-top:4px">You can act in ${esc(c.name)} only. Serious cases go to the platform team. You can’t make official NYSC announcements.</div></div>
  <button class="btn dark sm" style="height:42px" data-a="commEdit" data-id="${c.id}">${I('edit',16)}Edit info and rules</button>
  <div class="sec">Reported content · ${open.length}</div>
  ${open.length?open.map((p,i)=>{const u=user(p.author);return `<div class="card stack" style="gap:8px"><div class="row" style="gap:8px">${av(u,32)}<span style="flex:1;min-width:0;font-size:14px;font-weight:600">${esc(u.name)}</span><span class="tag oranges">${MOD_REASONS[(i+p.id.length)%MOD_REASONS.length]}</span></div><div style="font-size:14px;line-height:1.4;color:var(--soft)">${esc((p.title||p.text).slice(0,140))}</div><div class="hint">Reported by ${2+i} members</div><div class="row" style="gap:6px"><button class="btn sm danger" style="flex:1" data-a="modRemove" data-id="${p.id}">Remove</button><button class="btn sm dark" style="flex:1" data-a="modDismiss" data-id="${p.id}">Keep</button><button class="btn sm dark" data-a="modEscalate" data-id="${p.id}">Escalate</button></div></div>`;}).join(''):empty('No open reports','You’re all caught up.')}
  <div class="sec">Members</div>
  <div class="list">${mem.map(id=>{const u=USERS[id];return `<div class="li">${av(u,40)}<span class="t"><b>${esc(u.name)}</b><span>@${esc(u.username)}</span></span><button class="btn sm dark" data-a="modKick" data-id="${c.id}" data-u="${id}">Remove</button></div>`;}).join('')}</div>
  <div class="hint">Tip: use a post’s ••• menu to pin it or remove it.</div>${modExtras(c)}`;
}

LIVE.commentLive=val=>{const box=document.getElementById('mentionBox');if(!box)return;const m=val.match(/@([A-Za-z0-9_.]*)$/);if(!m){box.innerHTML='';return;}const q=m[1].toLowerCase();const us=Object.values(USERS).filter(u=>u.username.toLowerCase().includes(q)||u.name.toLowerCase().includes(q)).slice(0,4);box.innerHTML=us.length?`<div class="chips" style="padding:0">${us.map(u=>`<button class="chip on" data-a="pickMention" data-u="${u.username}" style="background:var(--raised);color:var(--text);border-color:var(--line2)">@${u.username}</button>`).join('')}</div>`:'';};

// ---- Explore: For You, job filter, search filters, recent searches
function forYouBody(){
  const me=S.me,near=(a,b)=>(b.state===me.state)-(a.state===me.state);
  const ok=l=>!l.deleted&&l.status==='Available'&&!hiddenAuthor(l.owner);
  const jobs=Object.values(LISTINGS).filter(l=>l.kind==='job'&&ok(l)).sort(near).slice(0,3);
  const items=Object.values(LISTINGS).filter(l=>l.kind==='item'&&ok(l)).sort(near).slice(0,4);
  const places=Object.values(LISTINGS).filter(l=>l.kind==='accommodation'&&ok(l)).sort(near).slice(0,2);
  const evs=Object.values(EVENTS).filter(e=>!e.deleted&&e.status==='Upcoming').slice(0,2);
  const ppl=Object.values(USERS).filter(u=>!S.following.has(u.id)&&!S.blocked.has(u.id)).slice(0,3);
  const comms=Object.values(COMM).filter(c=>!c.joined).slice(0,3);
  const sec=(t,h,tab)=>`<div class="row" style="justify-content:space-between;padding:14px 2px 8px"><span class="eyebrow">${t}</span>${tab?`<button data-a="exTab" data-v="${tab}" style="font-size:13px;font-weight:700;color:var(--accent-text);min-height:32px">See all</button>`:''}</div>${h}`;
  const rec=S.recent.length?`<div class="pad" style="padding-bottom:0"><div class="row" style="justify-content:space-between"><span class="eyebrow">Recent searches</span><button data-a="clearRecent" style="font-size:13px;font-weight:700;color:var(--muted);min-height:32px">Clear</button></div><div class="chips" style="padding:8px 0 0">${S.recent.map(r=>`<button class="chip" data-a="setQ" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>`:'';
  return rec+`<div class="pad stack" style="gap:10px">${sec('Jobs for you',jobs.map(listingCard).join(''),'Jobs')}${sec('Marketplace picks',`<div class="grid2">${items.map(itemTile).join('')}</div>`,'Marketplace')}${sec('Places to stay',places.map(listingCard).join(''),'Accommodation')}${sec('Happening soon',evs.map(eventCard).join(''),'Events')}${sec('People to follow',ppl.map(userRow).join(''),'People')}${sec('Communities for you',comms.map(c=>commRow(c)).join(''),'Communities')}</div>`;
}
A.jobType=d=>{S.jobType=d.v;render();};
A.clearRecent=()=>{S.recent=[];render();};
A.retry=()=>{if(S.settings.offline)toast('Still offline');else render();};
A.searchType=d=>{S.searchType=d.v;const el=document.getElementById('exResults');if(el)el.innerHTML=exploreBody();else render();};
function searchResults(q){
  const m=s=>String(s||'').toLowerCase().includes(q);
  const T=S.searchType,on=k=>T==='All'||T===k;
  const ppl=Object.values(USERS).filter(u=>!S.blocked.has(u.id)&&(m(u.name)||m(u.username)||m(u.state)));
  const com=Object.values(COMM).filter(c=>m(c.name)||m(c.desc)||m(c.category));
  let pos=Object.values(POSTS).filter(p=>!p.deleted&&!hiddenAuthor(p.author)&&p.vis!=='Followers'&&p.vis!=='Community'&&(m(p.text)||m(p.title)));
  const lis=Object.values(LISTINGS).filter(l=>!l.deleted&&!hiddenAuthor(l.owner)&&(m(l.title)||m(l.desc)||m(l.area)||m(l.state)||m(l.company)||m(l.jobType)));
  const evs=Object.values(EVENTS).filter(e=>!e.deleted&&(m(e.title)||m(e.location)||m(e.state)));
  const pl=STATES.filter(s=>m(s));
  const tag=TRENDING.find(t=>t[0].slice(1).toLowerCase()===q);
  if(tag&&!pos.length) pos=Object.values(POSTS).filter(p=>p.type!=='announcement'&&!p.deleted&&p.vis==='Public').sort((a,b)=>b.likes-a.likes).slice(0,4);
  const sec=(t,h)=>h?`<div class="sec">${t}</div>${h}`:'';
  const parts=[
    on('Places')?sec('Places',pl.slice(0,3).map(s=>`<button class="card row" data-a="exPlace" data-v="${s}" style="width:100%;text-align:left;padding:12px">${I('mappin',20,'style="color:var(--accent-text)"')}<span style="flex:1"><b>${s}</b><span class="hint" style="display:block">Rentals, jobs, items, events and people in ${s}</span></span>${I('chevR',18)}</button>`).join('')):'',
    on('People')?sec('People',ppl.slice(0,T==='People'?20:3).map(userRow).join('')):'',
    on('Communities')?sec('Communities',com.slice(0,T==='Communities'?20:3).map(c=>commRow(c)).join('')):'',
    on('Jobs')?sec('Jobs',lis.filter(l=>l.kind==='job').slice(0,T==='Jobs'?20:3).map(listingCard).join('')):'',
    on('Items')?sec('Items for sale',lis.filter(l=>l.kind==='item').slice(0,T==='Items'?20:3).map(listingCard).join('')):'',
    on('Rentals')?sec('Accommodation',lis.filter(l=>l.kind==='accommodation').slice(0,T==='Rentals'?20:3).map(listingCard).join('')):'',
    on('Events')?sec('Events',evs.slice(0,T==='Events'?20:3).map(eventCard).join('')):'',
    on('Posts')?sec('Posts',pos.slice(0,T==='Posts'?20:4).map(p=>postCard(p)).join('')):''
  ];
  const row=chips(['All','People','Posts','Communities','Jobs','Items','Rentals','Events','Places'],T,'searchType');
  const head=tag?`<div class="pad" style="padding-bottom:8px"><div class="card row" style="gap:10px"><span class="ico" style="width:40px;height:40px;border-radius:14px;background:#C8F169;color:var(--ink);display:flex;align-items:center;justify-content:center">${I('trend',20)}</span><span><b class="hd" style="font-size:18px">${esc(tag[0])}</b><span class="hint" style="display:block">${tag[1]} across Nigeria</span></span></div></div>`:'';
  return row+head+(parts.some(Boolean)?`<div class="pad stack">${parts.join('')}</div>`:`<div class="pad">${empty(`No ${T==='All'?'':T.toLowerCase()+' '}results for “${esc(S.q)}”`,'Check the spelling or try a broader word.')}</div>`);
}
A.eventRemind=d=>{const e=EVENTS[d.id];e.remind=!e.remind;render();toast(e.remind?'We’ll remind you the day before':'Reminder off');};

  <div class="card"><div class="hd" style="font-weight:700;font-size:17px;margin-bottom:6px">Trending in Nigeria</div>${TRENDING.slice(0,5).map(([t,c])=>`<button class="rl" data-a="railQ" data-v="${t.slice(1)}"><span style="flex:1"><b style="display:block;font-size:14px">${t}</b><span class="hint">${c}</span></span>${I('trend',16,'style="color:var(--accent-text)"')}</button>`).join('')}</div>

`;

A.addComment=d=>{const t=v('comment');if(!t)return toast('Write something first');const p=POSTS[d.id],ri=S.draft.replyTo;
  if(ri!=null&&p.comments[ri]){const c=p.comments[ri];(c.replies=c.replies||[]).push({u:'me',t,time:'now',likes:0});}
  else p.comments.push({u:'me',t,time:'now',likes:0});
  p.cc++;S.draft.comment='';S.draft.replyTo=null;render();scrollBottom();};
POSTS.p2.comments[0].replies=[{u:'amaka',t:'Hold the cup tight, Platoon 7!',time:'45m',likes:2},{u:'emeka',t:'Rematch at the parade ground?',time:'40m',likes:1}];
POSTS.p2.cc+=2;

// ---- Join requests, invite links and camp schedule submissions (moderator tools)
COMM['b-football'].join='request';
COMM['b-football'].requests=['funke','halima','yusuf','samuel'];
COMM['b-football'].invites=[{code:'bfc-8x2k',uses:12,max:50,days:21}];
COMM['kano-camp'].mods.push('me');
COMM['kano-camp'].camp=true;
COMM['kano-camp'].invites=[{code:'kano-camp-p7',uses:48,max:200,days:10}];
COMM['kano-camp'].requests=[];
const CAMP_PENDING=[{time:'6:30 PM',title:'Cultural night rehearsal',where:'Hall B',status:'Waiting for approval'}];
function modExtras(c){
  const reqs=c.requests||[],inv=c.invites=c.invites||[];
  let h='';
  if(c.join==='request'||reqs.length){
    h+=`<div class="sec">Join requests · ${reqs.length}</div>`+(reqs.length?`<div class="list">${reqs.map(id=>{const u=USERS[id];return `<div class="li">${av(u,40)}<span class="t"><b>${esc(u.name)}</b><span>@${esc(u.username)} · ${shortBatch(u.batch)} · ${esc(u.state)}</span></span><button class="btn sm lime" data-a="reqApprove" data-c="${c.id}" data-u="${id}">Approve</button><button class="btn sm dark" style="margin-left:6px" data-a="reqDecline" data-c="${c.id}" data-u="${id}">Decline</button></div>`;}).join('')}</div>`:empty('No pending requests','New requests show up here.'));
  }
  h+=`<div class="sec">Invite links</div>`+(inv.length?`<div class="list">${inv.map((x,i)=>`<div class="li"><span class="ico">${I('link',18)}</span><span class="t"><b>corpersconnect.com/join/${x.code}</b><span>${x.uses} joined${x.max?' of '+x.max:''} · expires in ${x.days} days</span></span><button class="btn sm dark" data-a="copyText" data-v="https://corpersconnect.com/join/${x.code}">Copy</button><button class="btn sm danger" style="margin-left:6px" data-a="revokeInvite" data-c="${c.id}" data-i="${i}">Revoke</button></div>`).join('')}</div>`:'<div class="hint">No active links.</div>')+`<button class="btn dark sm" style="margin-top:8px" data-a="newInvite" data-c="${c.id}">${I('plus',14)}Create invite link</button>`;
  if(c.camp){
    h+=`<div class="sec">Camp schedule · today</div><div class="list">${CAMP_TODAY.map(([t,n])=>`<div class="li"><span class="t"><b>${esc(n)}</b><span>${t} · published</span></span><span class="tag lime">Live</span></div>`).join('')}${CAMP_PENDING.map((x,i)=>`<div class="li"><span class="t"><b>${esc(x.title)}</b><span>${x.time} · ${esc(x.where)}</span></span><span class="tag or">${x.status}</span><button class="btn sm dark" style="margin-left:6px" data-a="withdrawSched" data-i="${i}">Withdraw</button></div>`).join('')}</div>
    <button class="btn dark sm" style="margin-top:8px" data-a="addSchedule">${I('plus',14)}Add schedule item</button><div class="hint" style="margin-top:6px">An admin approves new items before members in camp see them.</div>`;
  }
  return h;
}
A.reqApprove=d=>{const c=COMM[d.c];c.requests=c.requests.filter(x=>x!==d.u);c.members++;render();toast(first(USERS[d.u])+' joined '+c.name);};
A.reqDecline=d=>{const c=COMM[d.c];c.requests=c.requests.filter(x=>x!==d.u);render();toast('Request declined. '+first(USERS[d.u])+' is told.');};
A.newInvite=d=>{const c=COMM[d.c];const code=(c.id.split('-').map(w=>w[0]).join('')+'-'+Math.random().toString(36).slice(2,6));(c.invites=c.invites||[]).unshift({code,uses:0,max:50,days:30});render();toast('Invite link created');};
A.revokeInvite=d=>{COMM[d.c].invites.splice(+d.i,1);render();toast('Invite link revoked');};
A.withdrawSched=d=>{CAMP_PENDING.splice(+d.i,1);render();toast('Withdrawn');};
A.addSchedule=()=>{S.draft.stime='10:00';S.draft.stitle='';S.draft.swhere='';sheet({type:'campItem'});};
SH.campItem=()=>`<h2>Add a schedule item</h2><p class="hint" style="margin:0 0 12px">Shown to members in camp once an admin approves it.</p><div class="stack">${fld('stime','Time',{type:'time'})}${fld('stitle','What’s happening?',{ph:'e.g. Parade rehearsal',attrs:'maxlength="60"'})}${fld('swhere','Where',{ph:'e.g. Parade ground',opt:true})}</div><button class="btn lime block" style="margin-top:14px" data-a="submitSchedule">Send for approval</button>`;
A.submitSchedule=()=>{S.errors={};if(!need('stitle','Add a title.',x=>x.length>=3))return render();CAMP_PENDING.push({time:fmtTime(v('stime')),title:v('stitle'),where:v('swhere')||'Camp',status:'Waiting for approval'});closeSheet();toast('Sent to the platform team for approval');};

// ---- Install prompt (PWA)
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;try{render();}catch(_){}});
window.addEventListener('appinstalled',()=>{deferredInstall=null;try{localStorage.setItem('cc-installed','1');}catch(_){}try{render();}catch(_){}});
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(_){return null;}};
const showInstall=()=>!isStandalone()&&!lsGet('cc-install-hide')&&!lsGet('cc-installed');
function installCard(){if(!showInstall())return '';
  return `<div style="padding:0 12px 10px"><div class="card row" style="gap:12px;border:1px solid var(--accent-border);background:transparent;padding:12px 14px"><span class="ico" style="width:42px;height:42px;border-radius:14px;background:#C8F169;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none">${I('download',20)}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px">Add Corpers Connect to your home screen</b><span class="hint">Opens like an app and uses less data.</span></span><button class="btn sm lime" data-a="installApp">Install</button><button class="ib" style="width:34px;height:34px;background:transparent;flex:none" data-a="hideInstall" aria-label="Dismiss">${I('x',16)}</button></div></div>`;}
A.installApp=async()=>{if(deferredInstall){deferredInstall.prompt();let r;try{r=await deferredInstall.userChoice;}catch(_){}deferredInstall=null;if(r&&r.outcome==='accepted')toast('Installed. Open it from your home screen.');render();}else sheet({type:'install'});};
A.hideInstall=()=>{try{localStorage.setItem('cc-install-hide','1');}catch(_){}render();};
SH.install=()=>`<h2>Add to your home screen</h2><p class="hint" style="margin:0 0 12px">Corpers Connect installs like an app. No store needed.</p>
  <div class="stack" style="gap:10px"><div class="card" style="background:var(--raised)"><b>iPhone (Safari)</b><ol style="margin:8px 0 0;padding-left:20px;color:var(--soft);font-size:14px;line-height:1.6"><li>Tap the Share button.</li><li>Choose “Add to Home Screen”.</li><li>Tap Add. Open it from your home screen to get notifications.</li></ol></div>
  <div class="card" style="background:var(--raised)"><b>Android (Chrome)</b><ol style="margin:8px 0 0;padding-left:20px;color:var(--soft);font-size:14px;line-height:1.6"><li>Tap the ⋮ menu.</li><li>Choose “Install app” or “Add to Home screen”.</li><li>Confirm. It appears with your other apps.</li></ol></div>
  <div class="card" style="background:var(--raised)"><b>Laptop (Chrome or Edge)</b><p style="margin:6px 0 0;color:var(--soft);font-size:14px">Click the install icon at the right of the address bar.</p></div></div>`;


document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||!app().contains(el))return;
  const a=el.dataset.a;if(a==='noop')return;
  if(el.disabled)return;
  const f=A[a];if(!f)return;
  e.preventDefault();e.stopPropagation();f(el.dataset,el);
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.k&&t.tagName!=='SELECT'){S.draft[t.dataset.k]=t.value;if(S.errors[t.dataset.k]){delete S.errors[t.dataset.k];t.classList.remove('bad');const er=document.getElementById('err-'+t.dataset.k);if(er)er.remove();}}
  if(t.dataset.live)LIVE[t.dataset.live](t.value);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.type==='file'&&t.dataset.file){FILES[t.dataset.file](t.files);t.value='';return;}
  if(t.dataset.c){CH[t.dataset.c](t.value);return;}
  if(t.tagName==='SELECT'&&t.dataset.k){S.draft[t.dataset.k]=t.value;if(t.dataset.rerender)render();}
});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();A[t.dataset.enter]({id:t.dataset.id});}
  if(e.key==='Escape'&&S.lb){S.lb=null;render();return;}
  if(e.key==='Escape'&&S.sheet){closeSheet();}
});
render();
</script><script>CCTheme.set('light');localStorage.removeItem('cc-install-hide');A.demo({});go('post',{id:'p2'});A.replyTo({i:0});</script>
