#stage{min-height:100%;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
/* Responsive: phone is the base layout. Tablet and desktop adapt the same screens. */
#rail{display:none}
.nav .lb{display:none}
.nav.dxo{display:none}
.nav .dx{display:none}
.nav .sep{height:1px;background:var(--line);margin:6px 10px;flex:none}
@media (min-width:640px){

PO({author:'aisha',community:'job-leads',title:'Hiring tip: how recruiters read corper CVs',text:'I screen CVs in Abuja. Three things get attention: 1) clear outcomes (not duties), 2) a CDS or community project, 3) a link to your work. Typos kill applications faster than weak experience.',time:'20m',likes:1200,cc:120,reposts:140,comments:[['victor','This is gold. Add: tailor each CV.','15m',48],['chinedu','Saving this. Thank you.','10m',9]]});
PO({author:'victor',community:'job-leads',title:'Where to find jobs during service',text:'1) Your CDS group and PPA colleagues. 2) The Jobs tab here. 3) LinkedIn, but add “Corps member” in your headline. 4) Local business owners at your PPA. Do not pay anyone to “secure” a job.',time:'2h',likes:1800,cc:160,reposts:220,comments:[['ifeoma','Number 4 got me my interview.','1h',60]]});
PO({author:'chidera',community:'entrepreneurs',title:'Side hustle rules I learned the hard way',text:'Keep your PPA duties first. Reinvest the first profits. Write down prices before talking to clients. And never lend your capital to a friend without a note.',time:'4h',likes:1300,cc:90,reposts:130,comments:[]});
PO({author:'zainab',community:'redeploy',title:'Redeployment: what actually happened to me',text:'I applied on health grounds, got the letter after three weeks, then reported at the new state secretariat with copies. Keep every receipt. Your new state may take a few days to update your records.',time:'6h',likes:900,cc:100,reposts:84,comments:[['segun','Super helpful. Thanks Zainab.','5h',22]]});
PO({author:'ifeoma',community:'job-leads',title:'Writing a job post people trust',text:'If you share a job: name the company, role, pay, location and how to apply. No screenshots only. Corpers should be able to verify you in two minutes.',time:'9h',likes:760,cc:60,reposts:70,comments:[]});
PO({author:'tolu',community:'creators',title:'Freelance rate cheat-sheet for corpers',text:'Logo: ₦25–60k. Landing page: ₦80–200k. Social posts: ₦3–6k each. Charge more for rush work and always take 50% upfront.',time:'12h',likes:1400,cc:140,reposts:160,comments:[['femi','Add video editing: ₦15–40k per reel.','11h',31]]});
PO({author:'zainab',community:'ppa-stories',title:'Funny things my PPA taught me',text:'Never plan a meeting on Monday morning, always bring snacks for the school staff, and learn names of the cleaners. They know everything.',time:'1d',likes:2400,cc:210,reposts:300,comments:[]});
PO({author:'kemi',community:'oyo-cms',title:'Ibadan food map for corpers',text:'Amala at Bodija, bole at Sango, suya near Ring Road and cheap gari at the market. Drop your favourite below.',time:'1d',likes:800,cc:90,reposts:44,comments:[]});
PO({author:'ahmed',community:'kano-cms',title:'Kano transport tips',text:'Use Keke for short trips, Danfo for the main road and agree prices first. Avoid peak hour around the old city.',time:'2d',likes:530,cc:46,reposts:30,comments:[]});
PO({author:'grace',community:'foodies',title:'Allowee-friendly meal prep',text:'Cook rice and stew for four days. Keep a pot of beans. Buy vegetables on market day and freeze portions. You can eat well on ₦12k a week.',time:'2d',likes:1700,cc:120,reposts:210,comments:[]});
PO({author:'david',community:'cds-health',title:'Starting a CDS health outreach',text:'1) Get your LGA’s permission. 2) Partner with a nearby clinic. 3) Bring leaflets and basic equipment. 4) Document your impact and share it.',time:'3d',likes:950,cc:70,reposts:90,comments:[]});
PO({author:'chinedu',community:'batch-a-26',title:'Passing out checklist',text:'Clearance letter, CDS certificate, PPA release letter, medical forms and your ID card. Do not wait until the last week.',time:'3d',likes:1100,cc:80,reposts:110,comments:[]});
PO({author:'femi',community:'alumni-net',title:'Life after NYSC: first six months',text:'Take a break, update your CV, build a portfolio and keep your camp friends close. Your network is your net worth.',time:'4d',likes:1900,cc:140,reposts:170,comments:[]});

function joinBtn(c,sm){
  const cls=sm?'btn sm':'btn';
  if(c.joined) return `<button class="${cls} light" data-a="leaveComm" data-id="${c.id}" style="${sm?'':'height:42px'}">${I('check',16)}Joined</button>`;
  if(S.requested.has(c.id)) return `<button class="${cls} dark" data-a="cancelRequest" data-id="${c.id}" style="${sm?'':'height:42px'}">Requested</button>`;
  const label=c.join==='request'?'Request':c.join==='invite'?'Invite only':'Join';
  return `<button class="${cls} lime" data-a="joinComm" data-id="${c.id}" style="${sm?'':'height:42px'}" ${c.join==='invite'?'disabled':''}>${label}</button>`;
}
function userRow(u){
  const f=S.following.has(u.id);
  const mutual=f&&u.followsMe;
  return `<div class="row card" style="padding:12px">
    <button data-a="openUser" data-id="${u.id}" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left">${av(u,46)}
    <span style="min-width:0;display:block"><span style="display:flex;align-items:center;gap:5px;font-weight:600">${esc(u.name)}${vb(u,14)}</span>
    <span style="display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">@${esc(u.username)} · ${shortBatch(u.batch)} · ${esc(u.state)}</span>
    ${mutual?'<span class="tag grey" style="margin-top:4px;padding:2px 6px;font-size:10px">Mutual</span>':u.followsMe&&!f?'<span class="tag grey" style="margin-top:4px;padding:2px 6px;font-size:10px">Follows you</span>':''}</span></button>
    ${u.id==='me'?'':`<button class="btn sm ${f?'dark':'lime'}" data-a="follow" data-id="${u.id}">${f?'Following':'Follow'}</button>`}</div>`;
}

// ---------- Render loop ----------
const app=()=>document.getElementById('app');
function topScreen(){return S.stack[S.stack.length-1];}
function keyOf(t){return S.stack.length+':'+t.s+':'+(t.id||'');}
function render(){
  const view=document.getElementById('view');
  const sc=view.querySelector('.scroll'); if(sc&&S.curKey) S.scrollMem[S.curKey]=sc.scrollTop;
  const t=topScreen();
  const fn=SC[t.s]||SC.unavailable;
  view.innerHTML=fn(t);
  // Inner pages (settings, notifications, detail screens) keep the desktop sidebar and right column
  {const root=S.stack[0]&&S.stack[0].s,inApp=['home','community','explore','profile'].includes(root);
   if(inApp&&!view.querySelector('.nav'))view.insertAdjacentHTML('beforeend',nav(root).replace('class="nav"','class="nav dxo"'));}
  app().dataset.s=t.s;app().dataset.nav=view.querySelector('.nav')?'1':'0';
  document.getElementById('sheet').innerHTML=S.sheet?`<div class="sheet-wrap" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-a="noop"><div class="grab"></div>${SH[S.sheet.type](S.sheet)}</div></div>`:'';
  renderRail();
  if(S.lb) document.getElementById('sheet').innerHTML+=lbHtml();
  const k=keyOf(t); const nsc=view.querySelector('.scroll'); if(nsc) nsc.scrollTop=S.scrollMem[k]||0; S.curKey=k;
  if(S.focus){const el=document.getElementById(S.focus); if(el){el.focus(); if(el.setSelectionRange&&el.type!=='email'&&el.type!=='number'){try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}} S.focus=null;}
}
function go(s,params={}){S.errors={}; S.sheet=null; if(INIT[s]) INIT[s](params); S.stack.push({s,...params}); render();}
function replace(s,params={}){S.errors={}; S.sheet=null; if(INIT[s]) INIT[s](params); S.stack[S.stack.length-1]={s,...params}; S.scrollMem[keyOf(topScreen())]=0; render();}
function back(){S.errors={}; S.sheet=null; if(S.stack.length>1){delete S.scrollMem[keyOf(topScreen())]; S.stack.pop();} render();}
function tabTo(t){S.errors={}; S.sheet=null; S.stack=[{s:t}]; render();}
function sheet(o){S.sheet=o; render();}
function closeSheet(){S.sheet=null; render();}
function toast(m){const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=m; app().appendChild(el); setTimeout(()=>el.remove(),2600);}

// ===== Home =====
function hiddenAuthor(id){return id&&id!=='me'&&(S.blocked.has(id)||S.muted.has(id));}
function refObj(r){return r.k==='post'?POSTS[r.id]:r.k==='listing'?LISTINGS[r.id]:EVENTS[r.id];}
function refAuthor(r){const o=refObj(r);return r.k==='post'?o.author:r.k==='listing'?o.owner:o.organiser;}
function refOk(r){const o=refObj(r);if(!o||o.deleted)return false;const a=refAuthor(r);if(hiddenAuthor(a))return false;
  if(r.k==='post'){if(o.community&&S.mutedComms.has(o.community)&&o.type!=='announcement')return false;if(o.type==='announcement'&&!COMM[o.community].joined)return false;}
  return true;}
function homeItems(){
  const f=S.homeFilter;let it=FEED.filter(refOk);
  if(f==='My Batch') it=it.filter(r=>{const o=refObj(r),a=refAuthor(r);return r.k==='post'?(o.batch||(a&&user(a).batch===S.me.batch)):(a&&user(a).batch===S.me.batch);});
  if(f==='My State') it=it.filter(r=>refObj(r).state===S.me.state);
  if(f==='Following') it=it.filter(r=>{const a=refAuthor(r);return a&&(a==='me'||S.following.has(a));});
  if(f==='For You'){let an=0;it=it.map((r,i)=>({r,k:(r.k==='post'&&refObj(r).type==='announcement'&&an++<2)?i-500:(S.following.has(refAuthor(r))?i-2.5:i)})).sort((a,b)=>a.k-b.k).map(x=>x.r);}
  return it;
}
function feedItem(r){return r.k==='post'?postCard(POSTS[r.id]):r.k==='listing'?listingCard(LISTINGS[r.id]):eventCard(EVENTS[r.id]);}
function verifBanner(){
  const m={unverified:['Get verified to unlock everything','Official communities, listings and events need verification.'],pending:['Verification in review','Usually within 48 hours. Some features stay locked until then.'],rejected:['Verification needs attention','See why and resubmit.']}[S.verif];
  if(!m) return '';
  return `<div style="padding:4px 12px 10px"><button class="card" data-a="go" data-s="verification" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:1px solid #FF8A3D;background:transparent;padding:12px 14px">${I(S.verif==='pending'?'clock':'shield',22,'style="color:var(--orange-text)"')}<span style="flex:1"><b style="display:block;font-size:14px">${m[0]}</b><span class="hint">${m[1]}</span></span>${I('chevR',18)}</button></div>`;
}
function campToday(){
  return `<div style="padding:0 12px 12px"><div class="card" style="padding:14px 0 14px 14px"><div class="row" style="padding-right:14px;justify-content:space-between"><span class="hd" style="font-weight:700;font-size:16px">Today at camp</span><span class="hint">Shared by camp admins</span></div>
  <div class="chips" style="padding:10px 14px 0 0">${CAMP_TODAY.map(([t,a],i)=>`<div style="flex:none;background:${i===3?'#FF8A3D':'var(--raised)'};color:${i===3?'var(--ink)':'var(--text)'};border-radius:16px;padding:10px 12px;min-width:120px"><div style="font-size:12px;font-weight:700;opacity:.85">${t}</div><div style="font-weight:600;font-size:14px;margin-top:2px">${a}</div></div>`).join('')}</div></div></div>`;
}
SC.home=()=>{
  const me=S.me,unread=NOTIF.some(n=>!n.read);
  const label={'Awaiting deployment':'Awaiting deployment','In camp':`Day 4 · ${me.state} camp`,'Serving':`Serving · ${me.state}`,'Completed':`Alumni · ${shortBatch(me.batch)}`}[me.status];
  const items=homeItems();
  const emp={'Following':empty('Nothing from people you follow yet','Follow corpers from your camp and state to see their posts here.',`<button class="btn sm lime" data-a="tab" data-t="explore">Find people</button>`),'My Batch':empty('Quiet in your batch','Be the first to post something.'),'My State':empty('Nothing in '+esc(me.state)+' yet','Check Explore to see what’s happening nationwide.')}[S.homeFilter]||empty('No posts yet','');
  return `<div class="scroll">
  <header style="display:flex;align-items:center;gap:8px;padding:18px 16px 8px">
    <div style="flex:1;min-width:0"><div class="eyebrow">${esc(label)}</div><div class="hd" style="font-weight:700;font-size:28px;margin-top:2px">Oya, what’s up?</div></div>
    <button class="ib" data-a="tab" data-t="explore" aria-label="Search">${I('search')}</button>
    <button class="ib" data-a="go" data-s="notifications" aria-label="Notifications${unread?', unread':''}">${I('bell')}${unread?'<span class="dot"></span>':''}</button>
  </header>
  ${verifBanner()}${installCard()}
  ${chips(['For You','My Batch','My State','Following'],S.homeFilter,'homeFilter')}
  ${S.homeFilter==='For You'&&me.status==='In camp'?campToday():''}
  <div class="pad stack">${S.settings.offline?offlineHtml():items.length?items.map(feedItem).join(''):emp}</div>
  ${items.length&&!S.settings.offline?'<div class="empty" style="padding:24px">You’re all caught up.</div>':''}
  </div>${nav('home')}`;
};

// ===== Post detail =====
SC.post=t=>{const p=POSTS[t.id];if(!p||p.deleted)return unavailable('post');
  const cs=p.comments||[];
  return `${tb(p.type==='poll'?'Poll':p.type==='question'?'Question':p.type==='discussion'?'Discussion':'Post')}
  <div class="scroll" style="padding-bottom:96px"><div class="pad">${postCard(p,true)}
  ${p.community?`<button class="row" data-a="go" data-s="communityDetail" data-id="${p.community}" style="margin:10px 4px 0;font-size:13px;color:var(--muted);min-height:36px">${I('users',14)}Posted in <b style="color:var(--text)">${esc(COMM[p.community].name)}</b></button>`:''}
  ${p.type==='announcement'?'':`<div class="sec" style="padding-top:14px">Comments · ${p.cc}</div>
  ${cs.length?cs.map((c,i)=>{const u=user(c.u);return `<div class="row" style="align-items:flex-start;gap:10px;padding:12px 0 0">
    <button data-a="openUser" data-id="${c.u}" aria-label="${esc(u.name)}">${av(u,36)}</button>
    <div style="flex:1;min-width:0"><div style="background:var(--surface);border-radius:4px 18px 18px 18px;padding:10px 12px"><div style="font-weight:600;font-size:13px;display:flex;gap:4px;align-items:center">${esc(u.name)}${vb(u,13)}</div><div style="font-size:14px;line-height:1.45;margin-top:2px;word-wrap:break-word">${esc(c.t)}</div></div>
    <div class="row" style="gap:16px;font-size:12px;color:var(--muted);padding:4px 4px 0"><span>${c.time}</span><button data-a="likeComment" data-id="${p.id}" data-i="${i}" style="font-weight:700;min-height:32px;color:${c.liked?'var(--orange-text)':'var(--muted)'}">${c.liked?'Liked':'Like'}${c.likes?' · '+c.likes:''}</button>${c.u==='me'?`<button data-a="delComment" data-id="${p.id}" data-i="${i}" style="font-weight:700;min-height:32px">Delete</button>`:`<button data-a="report" data-kind="comment" data-id="${p.id}" style="font-weight:700;min-height:32px">Report</button>`}<button data-a="replyTo" data-i="${i}" style="font-weight:700;min-height:32px">Reply</button></div>${(c.replies||[]).map((r,j)=>{const ru=user(r.u);return `<div class="row" style="align-items:flex-start;gap:8px;padding:8px 0 0"><button data-a="openUser" data-id="${r.u}" aria-label="${esc(ru.name)}">${av(ru,28)}</button><div style="flex:1;min-width:0"><div style="background:var(--raised);border-radius:4px 16px 16px 16px;padding:8px 10px"><div style="font-weight:600;font-size:12.5px;display:flex;gap:4px;align-items:center">${esc(ru.name)}${vb(ru,12)}</div><div style="font-size:13.5px;line-height:1.4;margin-top:2px;word-wrap:break-word">${rich(r.t)}</div></div><div class="row" style="gap:14px;font-size:12px;color:var(--muted);padding:2px 4px 0"><span>${r.time}</span>${r.u==='me'?`<button data-a="delReply" data-id="${p.id}" data-i="${i}" data-j="${j}" style="font-weight:700;min-height:28px">Delete</button>`:''}</div></div></div>`;}).join('')}</div></div>`;}).join(''):empty('No comments yet','Start the conversation.')}
  ${p.cc>cs.length&&cs.length?`<div class="hint" style="padding:14px 4px">Showing the most recent comments.</div>`:''}`}
  </div></div>
  ${p.type==='announcement'?'':`<div class="bottombar row" style="gap:8px"><div id="mentionBox" style="position:absolute;left:12px;right:12px;bottom:68px"></div>${S.draft.replyTo!=null&&cs[S.draft.replyTo]?`<div class="row" style="position:absolute;left:16px;right:16px;bottom:74px;background:var(--raised);border-radius:12px;padding:6px 10px;font-size:12.5px;justify-content:space-between"><span>Replying to <b>${esc(user(cs[S.draft.replyTo].u).name)}</b></span><button data-a="cancelReply" style="font-weight:700;color:var(--muted)">Cancel</button></div>`:''}${av(S.me,36)}<label for="f-comment" class="vh">Add a comment</label><input class="inp" style="height:44px;border-radius:22px" id="f-comment" data-live="commentLive" data-k="comment" data-enter="addComment" data-id="${p.id}" placeholder="${S.draft.replyTo!=null?'Write a reply…':'Add a comment…'}" value="${esc(S.draft.comment||'')}"><button class="ib lime" data-a="addComment" data-id="${p.id}" aria-label="Send comment">${I('send',18)}</button></div>`}`;};
INIT.post=()=>{S.draft={comment:'',replyTo:null};};

// ===== Community =====
SC.community=()=>{
  const joined=Object.values(COMM).filter(c=>c.joined);
  const offJ=joined.filter(c=>c.official),mine=joined.filter(c=>!c.official);
  const lockedOff=Object.values(COMM).filter(c=>c.official&&!c.joined);
  return `${tb('Communities',{back:false,right:`<button class="ib lime" data-a="newCommunity" aria-label="Create a community">${I('plus',22)}</button>`})}
  <div class="scroll"><div class="pad stack">
  ${seg(['Joined','Discover'],S.commView,'commView')}
  ${S.commView==='Joined'?`
    ${lockedOff.length&&!verified()?`<button class="card" data-a="go" data-s="verification" style="text-align:left;border:1px dashed var(--line3);background:transparent;display:flex;gap:12px;align-items:center">${I('lock',22,'style="color:var(--orange-text)"')}<span style="flex:1"><b style="display:block;font-size:14px">${lockedOff.length} official communities waiting</b><span class="hint">Your batch, camp and state spaces open after verification.</span></span>${I('chevR',18)}</button>`:''}
    ${offJ.length?`<div class="sec">Official</div>${offJ.map(c=>commRow(c)).join('')}`:''}
    <div class="sec">Your communities</div>
    ${mine.length?mine.map(c=>commRow(c)).join(''):empty('You haven’t joined any yet','Find people who share your interests, sport or state.',`<button class="btn sm lime" data-a="commView" data-v="Discover">Discover communities</button>`)}`
  :`<div style="position:relative"><span style="position:absolute;left:14px;top:15px;color:var(--muted)">${I('search',20)}</span><label for="f-cq" class="vh">Search communities</label><input class="inp" id="f-cq" type="search" data-live="commQ" value="${esc(S.commQ)}" placeholder="Search communities" style="padding-left:44px"></div>
    <div style="margin:0 -12px">${chips(['All',...CATEGORIES],S.commCat,'commCat')}</div>
    <div id="commResults" class="stack">${commResults()}</div>`}
  </div></div>${nav('community')}`;
};
function commResults(){
  const q=S.commQ.toLowerCase().trim();
  const r=Object.values(COMM).filter(c=>(S.commCat==='All'||c.category===S.commCat)&&(!q||(c.name+' '+c.desc+' '+c.sub).toLowerCase().includes(q)));
  return r.length?r.map(c=>commRow(c)).join(''):empty('No communities found','Try another search, or create one yourself.',`<button class="btn sm lime" data-a="newCommunity">Create a community</button>`);
}
SC.communityDetail=t=>{const c=COMM[t.id];const tab=S.commTab[c.id]||'Feed';
  const posts=FEED.filter(r=>r.k==='post'&&refOk(r)&&POSTS[r.id].community===c.id).map(r=>POSTS[r.id]);
  let body='';
  if(tab==='Feed'||tab==='Discussions'){
    const list=tab==='Feed'?posts:posts.filter(p=>p.type==='discussion'||p.type==='question');
    body=`${c.joined?`<button class="card row" data-a="create" data-comm="${c.id}" style="width:100%;text-align:left;padding:10px 12px;color:var(--muted);font-size:14px">${av(S.me,36)}<span style="flex:1">Share something with ${esc(c.name)}…</span>${I('image',20)}</button>`:''}
      ${list.length?list.map(p=>postCard(p)).join(''):empty(tab==='Feed'?'No posts yet':'No discussions yet',c.joined?'Start one from the box above.':'Join to start posting.')}`;
  } else if(tab==='Members'){
    const mods=[...(c.admin==='me'?['me']:[]),...c.mods];
    const others=Object.keys(USERS).filter(u=>!mods.includes(u)).slice(0,5);
    body=`<div class="sec">Admins & moderators</div>${mods.map(id=>{const u=user(id);return `<div class="card row" style="padding:12px"><button data-a="openUser" data-id="${id}" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left">${av(u,44)}<span style="min-width:0"><span style="display:flex;gap:5px;align-items:center;font-weight:600">${esc(u.name)}${vb(u,14)}</span><span class="hint">${id==='me'?'Admin (creator)':'Moderator'} · ${shortBatch(u.batch)}</span></span></button><span class="tag ${id==='me'?'lime':'line'}">${id==='me'?'Admin':'Mod'}</span></div>`;}).join('')}
      <div class="hint" style="padding:2px 4px">Moderators are corps members appointed by the platform. They are not NYSC officials.</div>
      <div class="sec">Members · ${c.members.toLocaleString()}</div>${others.map(id=>userRow(USERS[id])).join('')}
      <div class="hint" style="text-align:center;padding:8px">+ ${(c.members-others.length-mods.length).toLocaleString()} more</div>`;
  } else if(tab==='Moderate'&&isMod(c)){
    body=modPanel(c);
  } else if(tab==='Pinned'){
    body=c.pinned.length?c.pinned.map(x=>`<div class="card" style="display:flex;gap:12px;border:1px dashed var(--line3);background:transparent">${I('pin',20,'style="color:var(--orange-text)"')}<div><span class="tag orange">Moderator notice</span><div style="font-size:15px;line-height:1.45;margin-top:4px">${esc(x)}</div></div></div>`).join(''):empty('Nothing pinned','');
  } else {
    body=`<div class="card"><div class="hd" style="font-weight:700;font-size:18px">About</div><p style="margin:6px 0 0;line-height:1.5;color:var(--soft)">${esc(c.desc)}</p>
      <div class="stack" style="gap:8px;margin-top:12px;font-size:14px">${[['users',c.members.toLocaleString()+' members'],['tag2',c.category],[c.join==='open'?'globe':'lock',c.join==='open'?'Anyone can join':c.join==='request'?'Join by request':'Invite only'],['shield',c.official?'Official space created and governed by the platform':'Created by a verified corps member']].map(([i,s])=>`<div class="row">${I(i==='tag2'?'bookmark':i,16,'style="color:var(--accent-text)"')}${esc(s)}</div>`).join('')}</div></div>
      <div class="card"><div class="hd" style="font-weight:700;font-size:18px">Rules</div><ol style="margin:8px 0 0;padding-left:20px;line-height:1.6;color:var(--soft)">${c.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>
      ${c.official||c.admin==='me'?'':`<button class="btn dark block" data-a="modApply" data-id="${c.id}">${I('award',18)}Apply to moderate</button>`}
      <button class="btn block" style="color:var(--err)" data-a="report" data-kind="community" data-id="${c.id}">${I('flag',18)}Report community</button>`;
  }
  return `<div class="scroll">
  <div style="margin:12px;border-radius:28px;background:var(--surface);padding:14px 16px 18px;position:relative;overflow:hidden">
    <div style="position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:90px;background:${c.color};opacity:.14" aria-hidden="true"></div>
    <div class="row" style="justify-content:space-between;position:relative"><button class="ib" style="background:var(--raised)" data-a="back" aria-label="Back">${I('back')}</button><div class="row" style="gap:8px"><button class="ib" style="background:var(--raised)" data-a="share" data-kind="community" data-id="${c.id}" aria-label="Share community">${I('share')}</button><button class="ib" style="background:var(--raised)" data-a="commMenu" data-id="${c.id}" aria-label="More options">${I('more')}</button></div></div>
    <div class="row" style="gap:6px;margin-top:14px;position:relative;flex-wrap:wrap">${c.official?`<span class="tag lime">${I('shield',12)}Official</span>`:`<span class="tag oranges">Member-run</span>`}<span class="tag line">${esc(c.sub)}</span>${S.mutedComms.has(c.id)?`<span class="tag grey">${I('mute',12)}Muted</span>`:''}</div>
    <h1 class="hd" style="margin:10px 0 0;font-weight:700;font-size:30px;letter-spacing:-1px;line-height:1.02;position:relative">${esc(c.name)}</h1>
    <div class="row" style="gap:18px;margin-top:14px;position:relative">
      <div><div class="hd" style="font-weight:700;font-size:20px">${short(c.members)}</div><div style="font-size:12px;color:var(--muted)">members</div></div>
      <div><div class="hd" style="font-weight:700;font-size:20px">${c.today}</div><div style="font-size:12px;color:var(--muted)">posts today</div></div>
      <span style="margin-left:auto">${joinBtn(c,false)}</span>
    </div></div>
  <div class="chips">${['Feed','Discussions','Members','Pinned','About',...(isMod(c)?['Moderate']:[])].map(x=>`<button class="chip ${x===tab?'on':''}" data-a="commTab" data-id="${c.id}" data-v="${x}" aria-pressed="${x===tab}">${x}</button>`).join('')}</div>
  <div class="pad stack">${body}</div></div>${nav('community')}`;
};

const CT={photo:'Photo or video',discussion:'Start a discussion',question:'Ask a question',poll:'Create a poll',sell:'Sell an item',accommodation:'List accommodation',job:'Share a job',event:'Create an event'};
INIT.compose=p=>{S.draft={photos:[],dest:p.comm||'feed',alsoFeed:!p.comm,vis:'Public',optCount:2,duration:'1 day',condition:'Fairly used',state:S.me.state,type:'Self-contain',period:'/ year',jobType:'Full-time',jobUnit:'/ month',fees:1,fee0l:'Agency fee',wa:true,call:false,phone:'',organiser:'me',time:'16:00'};};
function photoPicker(label,req,single){const d=S.draft;
  return `<div class="field"><span class="flabel">${label}${req?'':' <span class="muted" style="font-weight:500">(optional)</span>'}</span>
  <div class="chips" style="padding:0">${d.photos.map((u,i)=>`<span style="position:relative;flex:none"><span class="ph" style="width:${single?150:96}px;height:96px">${isVid(u)?`<video src="${u}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0"></video>`:`<img src="${u}" alt="Selected photo ${i+1}">`}</span><button class="ib" style="position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:10px;background:rgba(15,18,17,.85)" data-a="rmPhoto" data-i="${i}" aria-label="Remove photo ${i+1}">${I('x',14)}</button></span>`).join('')}
  ${single&&d.photos.length?'':`<label for="cphotos" class="ph" style="width:96px;height:96px;border:1.5px dashed ${S.errors.photos?'#FF8A3D':'var(--line3)'};background:transparent;color:var(--muted);flex-direction:column;gap:4px;font-size:12px;font-weight:600;cursor:pointer">${I('camera',22)}Add</label>`}</div>
  <input id="cphotos" type="file" accept="${topScreen().t==='photo'?'image/*,video/*':'image/*'}" ${single?'':'multiple'} class="vh" data-file="composePhotos">${S.errors.photos?`<span class="err">${S.errors.photos}</span>`:''}</div>`;}
function destFields(){const d=S.draft;const joined=Object.values(COMM).filter(c=>c.joined);
  const inComm=d.dest!=='feed';const commOnly=inComm&&!d.alsoFeed;
  const vis=commOnly?'Community':(d.vis==='Community'?'Public':d.vis);
  return `${fld('dest','Post to',{opts:[['feed','My Home feed'],...joined.map(c=>[c.id,c.name])],rerender:true})}
  ${inComm?`<div class="list">${swRow('alsoFeed','Also share to my Home feed','Followers and Explore can see it too',d.alsoFeed)}</div>`:''}
  <div class="field"><span class="flabel">Who can see this</span>${commOnly?`<div class="card row" style="padding:12px 14px;font-size:14px">${I('users',18,'style="color:var(--accent-text)"')}Members of ${esc(COMM[d.dest].name)} only</div>`:seg(['Public','Followers'],vis,'setDraft','data-k="vis"')}
  <span class="hint">${commOnly?'It won’t appear in public search.':vis==='Public'?'Anyone can discover it in Explore across Nigeria.':'Only people who follow you.'}</span></div>`;}
function contactFields(){const d=S.draft;
  return `<div class="field"><span class="flabel">How people can reach you</span><div class="list">${swRow('wa','WhatsApp','Opens a chat with a pre-filled message',d.wa)}${swRow('call','Phone call','Shows your number when someone taps Call',d.call)}</div>${S.errors.contact?`<span class="err">${S.errors.contact}</span>`:''}<span class="hint">There’s no in-app chat. Your number is never shown on your profile.</span></div>
  ${fld('phone','Phone number for this listing',{type:'tel',prefix:'+234',prefixW:62,ph:'803 000 0000',attrs:'inputmode="tel"'})}`;}
SC.compose=t=>{const ty=t.t,d=S.draft;let f='';
  if(ty==='photo') f=photoPicker('Photos or video',true)+fld('text','Caption',{area:true,ph:'What’s happening?'})+fld('loc','Location',{opt:true,ph:'e.g. Parade ground',hint:'Shown as a general place, never your exact location.'})+destFields();
  if(ty==='discussion') f=fld('title','Title',{ph:'What do you want to talk about?',attrs:'maxlength="100"'})+fld('text','Details',{area:true,ph:'Share your thoughts, context or a story.'})+photoPicker('Photos',false)+destFields();
  if(ty==='question') f=fld('text','Your question',{area:true,ph:'e.g. Can we still change platoons after Wednesday?',hint:'Clear questions get better answers. Add your state or camp if it matters.'})+photoPicker('Supporting photo',false)+destFields();

  if(ty==='sell') f=photoPicker('Photos',true)+fld('title','What are you selling?',{ph:'e.g. Rechargeable fan',attrs:'maxlength="60"'})+`<div class="grid2">${fld('price','Price',{type:'number',prefix:'₦',prefixW:30,ph:'0',attrs:'inputmode="numeric" min="0"'})}${fld('condition','Condition',{opts:['New','Like new','Fairly used','Used']})}</div>`+fld('text','Description',{area:true,ph:'Size, age, any faults, pick-up details…'})+`<div class="grid2">${fld('state','State',{opts:STATES})}${fld('area','Area',{ph:'e.g. Kano Municipal'})}</div>`+contactFields();
  if(ty==='job') f=fld('title','Job title',{ph:'e.g. Junior frontend developer',attrs:'maxlength="60"'})+fld('company','Employer or company',{ph:'e.g. Kano Digital Hub',attrs:'maxlength="60"'})+fld('jobType','Type',{opts:['Full-time','Part-time','Contract','Internship','Gig']})+`<div class="grid2">${fld('price','Pay',{type:'number',prefix:'₦',prefixW:30,ph:'0',attrs:'inputmode="numeric" min="0"'})}${fld('jobUnit','Paid',{opts:[['/ month','Per month'],['/ week','Per week'],['/ event','Per task or event']]})}</div>`+fld('text','Description',{area:true,ph:'What the role involves, who it suits, whether it fits around CDS and PPA hours…'})+`<div class="grid2">${fld('state','State',{opts:STATES})}${fld('area','Area or LGA',{ph:'e.g. Ikeja'})}</div>`+photoPicker('Logo or photo',false)+contactFields()
    +`<div class="card row" style="background:transparent;border:1px solid #FF8A3D;font-size:13px;align-items:flex-start">${I('shield',18,'style="color:var(--orange-text);margin-top:1px"')}<span>Never ask applicants to pay. Listings that charge fees to apply are removed.</span></div>`;
  if(ty==='accommodation'){f=photoPicker('Photos',true)+fld('title','Title',{ph:'e.g. Self-contain near Gwarzo Road',attrs:'maxlength="60"'})+fld('type','Type',{opts:['Self-contain','Room in shared flat','Mini flat','1-bedroom flat','Hostel or lodge','Roommate wanted']})
    +`<div class="card" style="padding:14px"><div class="hd" style="font-weight:700;font-size:16px;margin-bottom:10px">Rent and fees</div><div class="grid2">${fld('price','Rent',{type:'number',prefix:'₦',prefixW:30,ph:'0',attrs:'inputmode="numeric"'})}${fld('period','Paid',{opts:[['/ year','Per year'],['/ month','Per month']]})}</div>
    <div class="flabel" style="margin:14px 0 6px">One-off fees</div><div class="stack" style="gap:8px">${Array.from({length:d.fees},(_,i)=>`<div class="row" style="gap:8px"><label class="vh" for="f-fee${i}l">Fee name</label><input class="inp" id="f-fee${i}l" data-k="fee${i}l" value="${esc(d['fee'+i+'l']||'')}" placeholder="e.g. Caution fee" style="flex:1.2"><label class="vh" for="f-fee${i}a">Amount</label><input class="inp" id="f-fee${i}a" data-k="fee${i}a" type="number" inputmode="numeric" value="${esc(d['fee'+i+'a']||'')}" placeholder="₦ 0" style="flex:1"><button class="ib" data-a="rmFee" data-i="${i}" aria-label="Remove fee">${I('x',18)}</button></div>`).join('')}</div>
    <button class="btn sm dark" style="margin-top:8px" data-a="addFee">${I('plus',16)}Add a fee</button><div class="hint" style="margin-top:8px">Rent is paid every period. Fees are one-off: agency, caution, legal and so on. Keeping them separate helps people avoid surprises.</div></div>`
    +fld('avail','Available from',{ph:'e.g. 15 December or Now'})+fld('text','Description',{area:true,ph:'Water, light, distance to landmarks, what stays behind…'})+`<div class="grid2">${fld('state','State',{opts:STATES})}${fld('area','Area or LGA',{ph:'e.g. Ikeja'})}</div>`+contactFields()
    +`<div class="card row" style="background:transparent;border:1px solid #FF8A3D;font-size:13px;align-items:flex-start">${I('shield',18,'style="color:var(--orange-text);margin-top:1px"')}<span>Only list places you’re allowed to rent or hand over. Listings reported as scams are reviewed first.</span></div>`;}
  if(ty==='event'){const comms=S.myComms.map(id=>COMM[id]);f=photoPicker('Cover image',false,true)+fld('title','Event name',{ph:'e.g. Batch B Kano meetup',attrs:'maxlength="70"'})+fld('text','What’s happening?',{area:true,ph:'Who it’s for, what to bring, what to expect.'})+`<div class="grid2">${fld('date','Date',{type:'date'})}${fld('time','Time',{type:'time'})}</div>`+fld('loc','Location',{ph:'Venue or landmark'})+fld('state','State',{opts:STATES})+fld('organiser','Organised by',{opts:[['me','Me ('+S.me.name+')'],...comms.map(c=>[c.id,c.name])]})+fld('link','Registration link',{type:'url',opt:true,ph:'https://',hint:'No tickets or payments in the app. Add an external link if you need sign-ups.'});}
  return `${tb(CT[ty],{close:true})}<div class="scroll" style="padding-bottom:100px"><div class="pad stack" style="gap:16px">
  <div class="row" style="gap:10px">${av(S.me,40)}<span><b style="display:flex;gap:4px;align-items:center">${esc(S.me.name)}${vb(S.me,14)}</b><span class="hint">${shortBatch(S.me.batch)} · ${esc(S.me.state)}</span></span></div>
  ${f}</div></div><div class="bottombar"><button class="btn lime block" data-a="publish" data-t="${ty}">${ty==='sell'||ty==='accommodation'?'Publish listing':ty==='job'?'Publish job':ty==='event'?'Publish event':'Post'}</button></div>`;};

// ===== Explore =====
SC.explore=()=>`${tb('Explore',{back:false,right:`<span class="tag line" style="height:32px">${I('globe',13)}All of Nigeria</span>`})}
  <div class="scroll"><div class="pad" style="padding-bottom:10px"><div style="position:relative"><span style="position:absolute;left:14px;top:15px;color:var(--muted)">${I('search',20)}</span><label for="f-q" class="vh">Search</label><input class="inp" id="f-q" type="search" data-live="exploreQ" value="${esc(S.q)}" placeholder="Search people, posts, places, listings…" style="padding-left:44px"></div></div>
  <div id="exResults">${exploreBody()}</div></div>${nav('explore')}`;
function stateOk(s){return S.exploreState==='All'||s===S.exploreState;}
function priceOk(p){return S.explorePrice==='Any'||(S.explorePrice==='lt20'&&p<20000)||(S.explorePrice==='mid'&&p>=20000&&p<=200000)||(S.explorePrice==='gt200'&&p>200000);}
function exFilters(withPrice){
  return `<div class="row pad" style="gap:8px;margin-bottom:12px">
  <label class="vh" for="exs">State</label><select id="exs" class="inp" data-c="exState" style="height:42px;border-radius:21px;font-size:13px;flex:1">${[['All','All of Nigeria'],...STATES.map(s=>[s,s])].map(([v,l])=>`<option value="${v}" ${S.exploreState===v?'selected':''}>${l}</option>`).join('')}</select>
  ${withPrice?`<label class="vh" for="exp">Price</label><select id="exp" class="inp" data-c="exPrice" style="height:42px;border-radius:21px;font-size:13px;flex:1">${[['Any','Any price'],['lt20','Under ₦20,000'],['mid','₦20k – ₦200k'],['gt200','Over ₦200,000']].map(([v,l])=>`<option value="${v}" ${S.explorePrice===v?'selected':''}>${l}</option>`).join('')}</select>
  <button class="chip ${S.availOnly?'on':''}" data-a="toggleAvail" aria-pressed="${!!S.availOnly}" style="height:42px;padding:0 12px">Available</button>`:''}</div>`;
}
function exploreBody(){
  const q=S.q.toLowerCase().trim();
  if(S.settings.offline) return offlineHtml();
  if(q) return searchResults(q);
  const tab=S.exploreTab;let body='';
  const lst=k=>Object.values(LISTINGS).filter(l=>!l.deleted&&l.kind===k&&stateOk(l.state)&&priceOk(l.price)&&(!S.availOnly||l.status==='Available')&&!hiddenAuthor(l.owner));
  if(tab==='For You'){body=forYouBody();}
  else if(tab==='Trending'){
    const top=Object.values(POSTS).filter(p=>p.type!=='announcement'&&!p.deleted&&!hiddenAuthor(p.author)&&p.vis!=='Followers'&&p.vis!=='Community').sort((a,b)=>b.likes-a.likes).slice(0,4);
    body=`<div class="pad stack"><div class="card" style="padding:6px 4px"><div class="hd" style="font-weight:700;font-size:17px;padding:10px 12px 4px">Trending across Nigeria</div>${TRENDING.map(([h,c],i)=>`<button class="li" data-a="setQ" data-v="${h.slice(1)}" style="border-color:var(--raised)"><span class="hd" style="width:26px;color:var(--muted);font-weight:700">${i+1}</span><span class="t"><b>${h}</b><span>${c}</span></span>${I('trend',18,'style="color:var(--accent-text)"')}</button>`).join('')}</div>
    <div class="sec">Popular posts</div>${top.map(p=>postCard(p)).join('')}</div>`;
  } else if(tab==='Nationwide'){
    const ps=Object.values(POSTS).filter(p=>p.type!=='announcement'&&!p.deleted&&p.state&&p.state!==S.me.state&&stateOk(p.state)&&!hiddenAuthor(p.author));
    body=exFilters(false)+`<div class="pad stack"><div class="hint" style="padding:0 4px">Posts from outside ${esc(S.me.state)}. Pick a state to narrow it down, for example before a redeployment.</div>${ps.length?ps.map(p=>`<div><div class="row" style="gap:6px;font-size:12px;color:var(--muted);padding:0 6px 6px">${I('mappin',13)}${esc(p.state)}</div>${postCard(p)}</div>`).join(''):empty('Nothing from this state yet','Try another state.')}</div>`;
  } else if(tab==='Marketplace'){
    const l=lst('item');body=exFilters(true)+`<div class="pad">${l.length?`<div class="grid2">${l.map(itemTile).join('')}</div>`:empty('No items match','Try a different state or price.')}</div>`;
  } else if(tab==='Jobs'){
    const l=lst('job').filter(x=>S.jobType==='All'||x.jobType===S.jobType);body=exFilters(true)+chips(['All','Full-time','Part-time','Contract','Internship','Gig'],S.jobType,'jobType')+`<div class="pad stack">${l.length?l.map(listingCard).join(''):empty('No jobs here yet','Know of an opening? Share it from the Create button.')}</div>`;
  } else if(tab==='Accommodation'){
    const l=lst('accommodation');body=exFilters(true)+`<div class="pad stack">${l.length?l.map(listingCard).join(''):empty('No places match','Try a different state or price.')}</div>`;
  } else if(tab==='Events'){
    const e=Object.values(EVENTS).filter(e=>!e.deleted&&stateOk(e.state)&&!hiddenAuthor(e.organiser));body=exFilters(false)+`<div class="pad stack">${e.length?e.map(eventCard).join(''):empty('No events here yet','Organise one from the Create button.')}</div>`;
  } else if(tab==='Communities'){
    body=`<div class="pad stack">${Object.values(COMM).map(c=>commRow(c)).join('')}</div>`;
  } else if(tab==='People'){
    const u=Object.values(USERS).filter(u=>stateOk(u.state)&&!S.blocked.has(u.id));body=exFilters(false)+`<div class="pad stack">${u.length?u.map(userRow).join(''):empty('No one found','Try another state.')}</div>`;
  }
  return chips(['For You','Trending','Nationwide','Marketplace','Jobs','Accommodation','Events','Communities','People'],tab,'exTab')+body;
}
function searchResults(q){
  const m=s=>String(s||'').toLowerCase().includes(q);
  const ppl=Object.values(USERS).filter(u=>!S.blocked.has(u.id)&&(m(u.name)||m(u.username)||m(u.state)));
  const com=Object.values(COMM).filter(c=>m(c.name)||m(c.desc)||m(c.category));
  const pos=Object.values(POSTS).filter(p=>!p.deleted&&!hiddenAuthor(p.author)&&p.vis!=='Followers'&&p.vis!=='Community'&&(m(p.text)||m(p.title)));
  const lis=Object.values(LISTINGS).filter(l=>!l.deleted&&(m(l.title)||m(l.desc)||m(l.area)||m(l.state)));
  const evs=Object.values(EVENTS).filter(e=>!e.deleted&&(m(e.title)||m(e.location)||m(e.state)));
  const pl=STATES.filter(s=>m(s));
  if(!ppl.length&&!com.length&&!pos.length&&!lis.length&&!evs.length&&!pl.length) return empty(`No results for “${esc(S.q)}”`,'Check the spelling or try a broader word.');
  const sec=(t,h)=>h?`<div class="sec">${t}</div>${h}`:'';
  return `<div class="pad stack">
  ${sec('Places',pl.slice(0,3).map(s=>`<button class="card row" data-a="exPlace" data-v="${s}" style="width:100%;text-align:left;padding:12px">${I('mappin',20,'style="color:var(--accent-text)"')}<span style="flex:1"><b>${s}</b><span class="hint" style="display:block">Accommodation, items, events and people in ${s}</span></span>${I('chevR',18)}</button>`).join(''))}
  ${sec('People',ppl.slice(0,3).map(userRow).join(''))}
  ${sec('Communities',com.slice(0,3).map(c=>commRow(c)).join(''))}
  ${sec('Listings',lis.slice(0,4).map(listingCard).join(''))}
  ${sec('Events',evs.slice(0,3).map(eventCard).join(''))}
  ${sec('Posts',pos.slice(0,4).map(p=>postCard(p)).join(''))}</div>`;
}

// ===== Listing detail =====
SC.listing=t=>{const l=LISTINGS[t.id];if(!l||l.deleted)return unavailable('listing');
  const o=user(l.owner),mine=l.owner==='me',acc=l.kind==='accommodation',job=l.kind==='job';
  const n=l.photos&&l.photos.length?l.photos.length:3;
  const idx=S.photoIdx?.[l.id]||0;
  const src=l.photos&&l.photos[idx];
  const tips=job?['Never pay a fee to get a job or interview.','Confirm the employer exists before sharing documents.','Meet in a public place or on a call first.','Report anything that looks like a scam.']:acc?['Inspect the property in person.','Confirm the person has the right to rent or hand it over.','Get all fees in writing before paying.','Never send a deposit before you’ve seen it.']:['Meet in a public place.','Check the item before paying.','Avoid paying in advance to strangers.'];
  return `<div class="scroll" style="padding-bottom:110px">
  <div class="ph" style="margin:12px;height:300px;border-radius:28px;background:${l.color};color:rgba(242,244,239,.3)" role="img" aria-label="${src?'Listing photo':'Photo placeholder'}">${src?`<img src="${src}" alt="">`:I(job?'briefcase':acc?'building':'bag',56)}
    <div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between">
      <button class="ib" style="background:rgba(15,18,17,.75);color:var(--on-dark)" data-a="back" aria-label="Back">${I('back')}</button>
      <div class="row" style="gap:8px"><button class="ib" style="background:rgba(15,18,17,.75);color:var(--on-dark)" data-a="share" data-kind="listing" data-id="${l.id}" aria-label="Share">${I('share')}</button>
      <button class="ib" style="${l.saved?'background:#C8F169;color:var(--ink)':'background:rgba(15,18,17,.75);color:var(--on-dark)'}" data-a="saveListing" data-id="${l.id}" aria-pressed="${l.saved}" aria-label="Save listing">${I('bookmark',20,l.saved?'style="fill:currentColor"':'')}</button></div></div>
    <div style="position:absolute;left:12px;bottom:12px;display:flex;gap:6px">${statusPill(l.status,l.kind).replace('padding:2px 7px','padding:5px 10px')}<span class="tag" style="background:rgba(15,18,17,.75);color:var(--on-dark);padding:5px 10px">${idx+1} / ${n}</span></div>
    ${n>1?`<button class="ib" style="position:absolute;right:12px;bottom:10px;background:rgba(15,18,17,.75);color:var(--on-dark);width:40px;height:40px" data-a="nextPhoto" data-id="${l.id}" data-n="${n}" aria-label="Next photo">${I('chevR',18)}</button>`:''}
  </div>
  <div style="padding:4px 18px 0" class="stack">
    <div><div class="eyebrow" style="color:var(--orange-text);font-weight:700">${job?'Job · '+esc(l.jobType):acc?esc(l.type):'For sale · '+esc(l.condition)} · ${esc(l.area)}</div>
    <h1 class="hd" style="margin:6px 0 0;font-weight:700;font-size:28px;letter-spacing:-.8px;line-height:1.05">${esc(l.title)}</h1></div>
    ${job?`<div class="card" style="padding:14px"><div class="hint">${esc(l.company)}</div><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="hd" style="font-weight:700;font-size:32px;color:var(--accent-text);line-height:1.05">${naira(l.price)}<span style="font-family:Inter;font-weight:500;font-size:14px;color:var(--muted)"> ${esc(l.unit)}</span></div></div><span class="tag line">${esc(l.jobType)}</span></div></div>`
    :acc?`<div class="card" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="hint">Rent ${l.unit==='/ month'?'per month':'per year'}</div><div class="hd" style="font-weight:700;font-size:32px;color:var(--accent-text);line-height:1.05">${naira(l.price)}</div></div><span class="tag line">Recurring</span></div>
      ${l.fees.length?`<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px" class="stack">${l.fees.map(([a,b])=>`<div class="row" style="justify-content:space-between;font-size:14px"><span class="muted">${esc(a)} <span style="font-size:12px">(one-off)</span></span><b>${naira(b)}</b></div>`).join('')}<div class="row" style="justify-content:space-between;font-size:14px;border-top:1px dashed var(--line);padding-top:8px"><span>Total to move in</span><b class="hd" style="font-size:17px">${naira(l.price+l.fees.reduce((a,f)=>a+f[1],0))}</b></div></div>`:''}</div>`
    :`<div class="hd" style="font-weight:700;font-size:34px;color:var(--accent-text);line-height:1">${naira(l.price)}</div>`}
    <div class="row" style="gap:8px">
      <button class="pill ${l.liked?'on-like':''}" data-a="likeListing" data-id="${l.id}" aria-pressed="${l.liked}">${I('heart',18,l.liked?'style="fill:currentColor"':'')}${l.likes}</button>
      <button class="pill" data-a="share" data-kind="listing" data-id="${l.id}">${I('repost',18)}Share</button>
      <button class="pill ${l.saved?'on-lime':''}" data-a="saveListing" data-id="${l.id}" aria-pressed="${l.saved}">${I('bookmark',18)}${l.saved?'Saved':'Save'}</button>
      <span class="hint" style="margin-left:auto">No comments on listings</span></div>
    <div class="list">${li({icon:'mappin',title:esc(l.area)+', '+esc(l.state),sub:'Exact address shared by the advertiser'})}${job?li({icon:'briefcase',title:esc(l.jobType),sub:esc(l.company)}):acc?li({icon:'cal',title:'Available '+esc(l.avail),sub:esc(l.type)}):li({icon:'bag',title:esc(l.condition),sub:'Condition'})}${li({icon:'clock',title:'Listed '+esc(l.date)})}</div>

    <p style="margin:0;font-size:15px;line-height:1.55;color:var(--soft)">${esc(l.desc)}</p>
    <div style="border:1px solid #FF8A3D;border-radius:20px;padding:14px"><div class="row" style="gap:8px;color:var(--orange-text);font-weight:700">${I('shield',18)}${job?'Check it’s real before you apply':acc?'See it before you pay':'Stay safe'}</div><ul style="margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--soft)">${tips.map(x=>`<li>${x}</li>`).join('')}</ul><div class="hint" style="margin-top:8px">The verified badge confirms NYSC membership, not that a job, property or item is genuine.</div></div>
    ${mine?'':`<button class="btn block" style="color:var(--err)" data-a="report" data-kind="listing" data-id="${l.id}">${I('flag',18)}Report listing</button>`}
  </div></div>
  <div style="position:absolute;left:12px;right:12px;bottom:18px;display:flex;gap:8px;padding:8px;border-radius:30px;background:var(--raised);box-shadow:0 10px 30px var(--shadow);z-index:4">

// ===== Profile =====
function journey(u,own){
  const order=['Awaiting deployment','In camp','Serving','Completed'],ix=order.indexOf(u.status);
  const vOk=own?verified():u.verified;
  const ms=[['Registered for NYSC',shortBatch(u.batch),true],['Received deployment',`Posted to ${u.state}`,ix>=1],['Reported to camp',u.camp||`${u.state} Orientation Camp`,ix>=1],['Completed orientation','Sworn in',ix>=2],['Posted to PPA','Details kept private',ix>=2]];
  (u.history||[]).forEach(h=>ms.push(['Redeployed',`${h.from} → ${h.to}`,true]));
  ms.push(['Completed service','Passed out',ix>=3]);
  const html=ms.map(([t,s,done])=>`<div class="m ${done&&vOk?'v':''}"><div class="row" style="gap:8px;flex-wrap:wrap"><b style="font-size:15px;${done?'':'color:var(--ph)'}">${t}</b>${done?(vOk?'<span class="tag lime" style="padding:2px 6px;font-size:10px">Verified</span>':'<span class="tag grey" style="padding:2px 6px;font-size:10px">Self-reported</span>'):'<span class="tag line" style="padding:2px 6px;font-size:10px">Up next</span>'}</div><div class="hint">${esc(s)}</div></div>`).join('');
  const pers=(own?S.me.milestones:[]).map(m=>`<div class="m p"><div class="row" style="gap:8px"><b style="font-size:15px">${esc(m.t)}</b><span class="tag" style="border:1px solid #FF8A3D;color:var(--orange-text);padding:2px 6px;font-size:10px">Personal</span></div><div class="hint">${esc(m.d)}</div></div>`).join('');
  const pend=own&&S.me.redeploy?`<div class="m p"><b style="font-size:15px">Redeployment to ${esc(S.me.redeploy.state)}</b><div class="hint">Under review</div></div>`:'';
  return `<div class="card" style="padding:18px 16px 2px"><div class="tl">${html}${pend}${pers}</div></div>
  ${own?`<div class="row" style="gap:8px"><button class="btn dark" style="flex:1" data-a="milestoneAdd">${I('plus',18)}Add milestone</button><button class="btn dark" style="flex:1" data-a="go" data-s="service">${I('swap',18)}Service info</button></div><div class="hint" style="padding:0 4px">Verified milestones come from your confirmed NYSC details. Personal ones are added by you and labelled.</div>`:''}`;
}
function profileHeader(u,own){
  const f=S.following.has(u.id);
  const vtag=own?{verified:'<span class="tag lime">'+I('check',12)+'Verified</span>',pending:'<span class="tag oranges">Pending</span>',rejected:'<span class="tag oranges">Action needed</span>',unverified:'<span class="tag grey">Unverified</span>'}[S.verif]:(u.verified?'<span class="tag lime">'+I('check',12)+'Verified</span>':'<span class="tag grey">Unverified</span>');
  const st=S.settings;
  const meta=[];
  meta.push([I('award',14),`${esc(u.batch)}${u.stream?' · '+esc(u.stream):''}`,own&&!st.showBatch]);
  if(u.camp&&u.status!=='Awaiting deployment') meta.push([I('building',14),esc(u.camp),own&&!st.showBatch]);
  meta.push([I('mappin',14),esc(u.state)+(u.lga?' · '+esc(u.lga):''),own&&!st.showState]);
  return `<div class="pad"><div class="card" style="padding:18px;position:relative;overflow:hidden">
    <div style="position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:85px;background:${u.color};opacity:.14" aria-hidden="true"></div>
    <div class="row" style="gap:16px;position:relative">${av(u,84)}
      <div class="row" style="flex:1;justify-content:space-around;text-align:center">
        <div><div class="hd" style="font-weight:700;font-size:20px">${own?S.myPosts.filter(id=>!POSTS[id].deleted).length:Object.values(POSTS).filter(p=>p.author===u.id).length}</div><div class="hint">Posts</div></div>
        <button data-a="openFollow" data-id="${u.id}" data-v="Followers" style="min-height:44px"><div class="hd" style="font-weight:700;font-size:20px">${short(u.followers+(own?0:(f?1:0)))}</div><div class="hint">Followers</div></button>
        <button data-a="openFollow" data-id="${u.id}" data-v="Following" style="min-height:44px"><div class="hd" style="font-weight:700;font-size:20px">${own?S.following.size:short(u.following)}</div><div class="hint">Following</div></button>
      </div></div>
    <div style="position:relative;margin-top:14px"><div class="row" style="gap:6px"><span class="hd" style="font-weight:700;font-size:24px">${esc(u.name)}</span>${vb(u,18)}</div>
    <div class="hint" style="font-size:14px">@${esc(u.username)}</div>
    <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">${vtag}${statusTag(u)}${!own&&u.followsMe?'<span class="tag grey">Follows you</span>':''}${!own&&u.followsMe&&f?'<span class="tag grey">Mutual</span>':''}</div>
    ${u.bio?`<p style="margin:12px 0 0;font-size:15px;line-height:1.45">${esc(u.bio)}</p>`:''}
    <div class="stack" style="gap:6px;margin-top:12px;font-size:13px;color:var(--soft)">${meta.map(([i,t,hid])=>`<div class="row" style="gap:8px"><span style="color:var(--accent-text)">${i}</span>${t}${hid?`<span class="hint row" style="gap:3px">${I('lock',12)}Only you</span>`:''}</div>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:16px">${own?`<button class="btn light sm" style="flex:1;height:42px" data-a="go" data-s="editProfile">Edit profile</button><button class="btn dark sm" style="flex:1;height:42px" data-a="go" data-s="${verified()?'service':'verification'}">${verified()?'Service info':'Get verified'}</button>`
      :`<button class="btn ${f?'dark':'lime'} sm" style="flex:1;height:42px" data-a="follow" data-id="${u.id}">${f?I('check',16)+'Following':'Follow'}</button><button class="btn dark sm" style="height:42px" data-a="share" data-kind="profile" data-id="${u.id}" aria-label="Share profile">${I('share',16)}</button>`}</div>
    </div></div></div>`;
}
SC.profile=()=>{
  const tab=S.profileTab,u=S.me;let body='';
  if(tab==='Posts'){const ps=S.myPosts.map(id=>POSTS[id]).filter(p=>!p.deleted);const rp=Object.values(POSTS).filter(p=>p.reposted&&!p.deleted);
    body=ps.length||rp.length?ps.map(p=>postCard(p)).join('')+(rp.length?`<div class="sec">Reposts</div>`+rp.map(p=>postCard(p)).join(''):''):empty('No posts yet','Share your first camp moment.',`<button class="btn sm lime" data-a="create">Create a post</button>`);}
  if(tab==='Journey') body=journey(u,true);
  if(tab==='Saved'){const sp=Object.values(POSTS).filter(p=>p.saved&&!p.deleted),sl=Object.values(LISTINGS).filter(l=>l.saved&&!l.deleted),se=Object.values(EVENTS).filter(e=>e.rsvp&&!e.deleted);
    body=sp.length||sl.length||se.length?`${sl.length?'<div class="sec">Listings</div>'+sl.map(listingCard).join(''):''}${se.length?'<div class="sec">Events you’re attending</div>'+se.map(eventCard).join(''):''}${sp.length?'<div class="sec">Posts</div>'+sp.map(p=>postCard(p)).join(''):''}`:empty('Nothing saved yet','Tap the bookmark on posts and listings to keep them here. Only you can see this.');}
  if(tab==='Listings'){const ml=S.myListings.map(id=>LISTINGS[id]).filter(l=>!l.deleted),me=S.myEvents.map(id=>EVENTS[id]).filter(e=>!e.deleted);
    body=ml.length||me.length?`${ml.length?'<div class="sec">Your listings</div>'+ml.map(listingCard).join(''):''}${me.length?'<div class="sec">Your events</div>'+me.map(eventCard).join(''):''}`:empty('No listings or events','Sell an item, hand over your apartment or organise a meetup.',`<button class="btn sm lime" data-a="create">Create</button>`);}
  return `<div class="scroll"><div class="topbar"><h1>Profile</h1><button class="ib" data-a="share" data-kind="profile" data-id="me" aria-label="Share profile">${I('share')}</button><button class="ib" data-a="go" data-s="settings" aria-label="Settings">${I('gear')}</button></div>
  ${profileHeader(u,true)}
  <div style="height:12px"></div>${chips(['Posts','Journey','Saved','Listings'],tab,'profileTab')}
  <div class="pad stack">${body}</div></div>${nav('profile')}`;
};
SC.user=t=>{const u=USERS[t.id];
  if(S.blocked.has(u.id)) return `${tb('@'+esc(u.username))}<div class="scroll nonav">${empty('You blocked '+esc(u.name),'You won’t see each other’s posts or be able to interact.',`<button class="btn sm dark" data-a="unblock" data-id="${u.id}">Unblock</button>`)}</div>`;
  const tab=S.userTab[u.id]||'Posts';let body='';
  if(tab==='Posts'){const ps=Object.values(POSTS).filter(p=>p.author===u.id&&!p.deleted);const ls=Object.values(LISTINGS).filter(l=>l.owner===u.id&&!l.deleted);
    body=(ps.length?ps.map(p=>postCard(p)).join(''):'')+(ls.length?'<div class="sec">Listings</div>'+ls.map(listingCard).join(''):'')||empty('No posts yet','');}
  if(tab==='Journey') body=journey(u,false);
  if(tab==='Communities'){const cs=Object.values(COMM).filter(c=>c.mods.includes(u.id)||(c.official&&(c.sub===u.batch||c.name.includes(u.state))));body=cs.length?cs.map(c=>commRow(c)).join(''):empty('No public communities','');}
  return `<div class="scroll">${tb('@'+esc(u.username),{right:`<button class="ib" data-a="userMenu" data-id="${u.id}" aria-label="More options">${I('more')}</button>`})}
  ${S.muted.has(u.id)?`<div class="pad" style="margin-bottom:10px"><div class="card row" style="padding:10px 14px;font-size:13px">${I('mute',16)}<span style="flex:1">Muted. Their posts are hidden from your feed.</span><button class="btn sm dark" data-a="unmute" data-id="${u.id}">Unmute</button></div></div>`:''}
  ${profileHeader(u,false)}<div style="height:12px"></div>
  <div class="chips">${['Posts','Journey','Communities'].map(x=>`<button class="chip ${x===tab?'on':''}" data-a="userTab" data-id="${u.id}" data-v="${x}" aria-pressed="${x===tab}">${x}</button>`).join('')}</div>
  <div class="pad stack">${body}</div></div>`;
};
SC.followList=t=>{const id=t.id,own=id==='me',u=user(id),tab=S.followTab;
  const others=Object.values(USERS).filter(x=>x.id!==id);
  const list=tab==='Followers'?(own?others.filter(x=>x.followsMe):others.slice(0,4)):(own?others.filter(x=>S.following.has(x.id)):others.slice(3,7));
  const total=tab==='Followers'?u.followers:(own?S.following.size:u.following);
  return `${tb(own?'Your connections':esc(u.name))}<div class="scroll nonav"><div class="pad stack">${seg(['Followers','Following'],tab,'followTab')}
  ${own?`<div class="hint" style="padding:0 4px">When you and someone follow each other, it shows as Mutual.</div>`:''}
  ${list.length?list.map(userRow).join(''):empty(tab==='Following'?'Not following anyone yet':'No followers yet','')}
  ${total>list.length&&list.length?`<div class="hint" style="text-align:center;padding:8px">+ ${(total-list.length).toLocaleString()} more</div>`:''}</div></div>`;};

SC.editProfile=()=>{const d=S.draft;const pv={photo:d.photo,initials:initials(d.name||'?'),color:S.me.color};
