<head>

<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">

<body class="status">
<main>
  <div class="box">

    <h1 class="hd">We’re making things better.</h1>
    <p>Corpers Connect is down for a short upgrade. Your posts, listings and messages are safe. Please check back in a few minutes.</p>
    <div class="cta-row" style="justify-content:center">
      <button class="btn lime" onclick="location.reload()">Try again</button>
      <a class="btn outline" href="/info.html#contact">Contact support</a>
    </div>
    <p style="margin-top:22px;font-size:14px">Expected back: <b style="color:var(--text)">within 30 minutes</b></p>
  </div>
